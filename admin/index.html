<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gestão | Cidade do Berço</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    /* RESET TOTAL PARA MOBILE */
    * { box-sizing: border-box !important; }
    body { margin: 0 !important; padding: 0 !important; overflow-x: hidden !important; width: 100vw !important; }

    /* REMOVER BARRA LATERAL E FORÇAR CENTRO */
    aside, [class*="SidebarContainer"] { display: none !important; }
    
    /* REMOVER MARGENS QUE EMPURRAM PARA A DIREITA */
    main, [class*="MainViewContainer"], [class*="CollectionMain"] {
      width: 100% !important;
      left: 0 !important;
      margin: 0 !important;
      padding: 10px !important;
      position: relative !important;
      transform: none !important;
    }

    /* CARDS DA LISTA OCUPAREM O ECRÃ TODO */
    [class*="CollectionCard"], a {
      width: 100% !important;
      margin: 10px 0 !important;
      left: 0 !important;
      display: block !important;
    }

    /* EDITOR (DENTRO DA EMPRESA) */
    [class*="Pane2"] { display: none !important; } /* Esconde preview */
    [class*="Pane1"] { width: 100% !important; min-width: 100% !important; }
    
    /* BARRA SUPERIOR */
    header { width: 100% !important; left: 0 !important; }
    
    /* BOTÕES DE PESQUISA E FILTRO */
    [class*="CollectionTop"] {
      flex-direction: column !important;
      align-items: flex-start !important;
      width: 100% !important;
    }
  </style>
</head>
<body>
  <script src="https://unpkg.com/netlify-cms@^2.10.192/dist/netlify-cms.js"></script>
</body>
</html>
