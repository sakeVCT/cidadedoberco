<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Cidade do Berço</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    // Forçar a abertura do widget de login se não estiver logado
    window.onload = () => {
      if (!window.localStorage.getItem('netlify-cms-user')) {
        window.netlifyIdentity.open();
      }
    };
  </script>
</body>
</html>
