<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Cidade do Berço</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Força o Widget a ligar-se ao teu Netlify
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
    // Linha de emergência: força o widget a abrir se demorar
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        if (!window.localStorage.getItem('netlify-cms-user')) {
          window.netlifyIdentity && window.netlifyIdentity.open();
        }
      }, 2000);
    });
  </script>
</body>
</html>
