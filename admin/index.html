<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gestão | Cidade do Berço</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    /* 1. LIMPEZA TOTAL DE MARGENS */
    body { margin: 0 !important; padding: 0 !important; background: #f4f4f9 !important; width: 100% !important; }
    
    /* Remover barra lateral e preview */
    aside, [class*="SidebarContainer"], [class*="Pane2"] { display: none !important; }

    /* 2. CORREÇÃO DO ALINHAMENTO (O PONTO CRÍTICO) */
    /* Removemos o 'left' e as margens que empurram o conteúdo para a direita */
    main, 
    [class*="MainViewContainer"], 
    [class*="CollectionMain"], 
    div[class*="AppCardContainer"],
    [class*="CollectionHeader"] {
      width: 100% !important;
      max-width: 100% !important;
      left: 0 !important;
      margin-left: 0 !important;
      margin-right: 0 !important;
      padding: 10px !important;
      position: relative !important;
      transform: none !important;
    }

    /* 3. FORMATAR OS CARDS (BOTÃO E LISTA) */
    /* Botão "New Empresas" */
    a[class*="Button"] {
      width: 100% !important;
      display: block !important;
      text-align: center !important;
      margin: 10px 0 !important;
      box-sizing: border-box !important;
    }

    /* Card da Empresa (ex: Testé) */
    [class*="CollectionCard"] {
      width: calc(100% - 20px) !important; /* Ocupa a largura quase toda com margem pequena */
      margin: 10px auto !important;
      padding: 15px !important;
      left: 0 !important;
      display: block !important;
      border: 1px solid #ddd !important;
      background: white !important;
      box-sizing: border-box !important;
    }

    /* Ajuste da barra de topo (Contents / Media) */
    header { width: 100% !important; left: 0 !important; position: relative !important; }
  </style>
</head>
<body>
  <script src="https://unpkg.com/netlify-cms@^2.0.0/dist/netlify-cms.js"></script>
</body>
</html>
