backend:
  name: git-gateway
  branch: main

media_folder: "static/images"
public_folder: "/images"

# Esta opção ajuda a evitar problemas de bloqueio de edição
publish_mode: simple

collections:
  - name: "empresas"
    label: "Empresas"
    folder: "content/empresas"
    create: true
    # Alteração aqui: removi complexidade para garantir que ele sobrescreva o ficheiro
    slug: "{{slug}}"
    editor:
      preview: false
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Categoria", name: "category", widget: "string"}
      - {label: "Estatuto Premium", name: "premium", widget: "boolean", default: false}
      - {label: "Início do Premium", name: "data_premium", widget: "datetime", format: "YYYY-MM-DD", required: false}
      - {label: "Telemóvel/WhatsApp", name: "whatsapp", widget: "string", required: false}
      - {label: "Email do Cliente", name: "email_cliente", widget: "string", required: false}
      - {label: "Website (URL)", name: "website", widget: "string", required: false}
      - {label: "Morada", name: "address", widget: "string", required: false}
      - {label: "Imagem de Capa", name: "image", widget: "image"}
      - {label: "Descrição (Body)", name: "body", widget: "markdown", required: false}
