backend:
  name: git-gateway
  branch: main

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  - name: "empresas"
    label: "Empresas"
    folder: "_empresas"
    create: true
    fields:
      - {label: "Nome", name: "title", widget: "string"}
      - {label: "Corpo", name: "body", widget: "markdown"}
