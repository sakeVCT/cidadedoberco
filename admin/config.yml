backend:
  name: github
  repo: sakevct/cidadedoberco
  branch: main

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "eleitos"
    label: "Eleitos"
    folder: "content/eleitos"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Ordem (1=Topo)", name: "order", widget: "number", default: 10}
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Categoria", name: "category", widget: "string"}
      - {label: "Imagem", name: "image", widget: "image"}
      - {label: "Descrição", name: "description", widget: "text"}
      - {label: "Telefone", name: "phone", widget: "string"}
      - {label: "Link Maps", name: "map_link", widget: "string"}
      - {label: "Nomeados", name: "nominees", widget: "string"}
