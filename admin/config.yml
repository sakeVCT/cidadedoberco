backend:
  name: git-gateway
  branch: main

media_folder: "static/images"
public_folder: "/images"

collections:
  - name: "empresas"
    label: "Empresas"
    folder: "content/empresas"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Categoria", name: "category", widget: "string"}
      - {label: "Estatuto Premium", name: "premium", widget: "boolean", default: false, hint: "Ative para destacar no topo com selo Diamond"}
      - {label: "Imagem", name: "image", widget: "image"}
      - {label: "Morada", name: "address", widget: "string"}
      - {label: "Corpo do Texto", name: "body", widget: "markdown"}
