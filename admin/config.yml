backend:
  name: git-gateway
  branch: main

media_folder: "static/images"
public_folder: "/images"

publish_mode: simple

collections:
  - name: "empresas"
    label: "Empresas"
    folder: "content/empresas"
    create: true
    slug: "{{title}}"
    summary: "{{title}} | {{data_premium}}"
    editor:
      preview: false
    fields:
      - {label: "Título da Empresa", name: "title", widget: "string"}
      
      # Mudámos para 'string' (texto). Se quiseres várias, escreve: Restaurante, Bar
      - {label: "Categorias (separe por vírgula)", name: "category", widget: "string", hint: "Ex: Restaurantes, Café, Tradicional"}

      - {label: "Estatuto Premium", name: "premium", widget: "boolean", default: false}
      - {label: "Expira em (ANO-MES-DIA)", name: "data_premium", widget: "string", required: false, hint: "Ex: 2026-05-20"}
      - {label: "Telemóvel/WhatsApp", name: "whatsapp", widget: "string", required: false}
      - {label: "Email", name: "email_cliente", widget: "string", required: false}
      - {label: "Website", name: "website", widget: "string", required: false}
      - {label: "Morada", name: "address", widget: "string", required: false}
      - {label: "Imagem", name: "image", widget: "image", required: false}
