backend:
  name: git-gateway
  branch: main

media_folder: "static/images"
public_folder: "/images"

collections:
  - name: "empresas"
    label: "Empresas"
    folder: "content/empresas"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Categoria", name: "category", widget: "string"}
      - {label: "Estatuto Premium", name: "premium", widget: "boolean", default: false}
      - {label: "Data de Inscrição/Pagamento", name: "data_pagamento", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false, hint: "A anuidade expira 1 ano após esta data"}
      - {label: "Email do Cliente", name: "email_cliente", widget: "string", required: false, hint: "Para saberes para onde enviar o aviso de renovação"}
      - {label: "Imagem", name: "image", widget: "image"}
      - {label: "Morada", name: "address", widget: "string"}
      - {label: "Corpo do Texto", name: "body", widget: "markdown"}
      
