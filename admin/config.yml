backend:
  name: git-gateway
  branch: main

media_folder: "static/images"
public_folder: "/images"

publish_mode: simple

collections:
  - name: "empresas"
    label: "Empresas"
    folder: "content/empresas"
    create: true
    slug: "{{title}}"
    
    # O SEGREDO ESTÁ AQUI: 
    # Ele mostra o Título e calcula os dias restantes entre a data de hoje e a data_premium
    summary: "{{title}} | {{category}} | ⏳ {{days_to_now data_premium}} dias restantes"

    editor:
      preview: false
    
    fields:
      - {label: "Título da Empresa", name: "title", widget: "string"}
      - {label: "Categoria", name: "category", widget: "string"}
      - {label: "Estatuto Premium", name: "premium", widget: "boolean", default: false}
      - {label: "Data de Expiração Premium", name: "data_premium", widget: "datetime", format: "YYYY-MM-DD", time_format: false, required: false, hint: "Escolhe o dia em que o Premium termina"}
      - {label: "Telemóvel/WhatsApp", name: "whatsapp", widget: "string", required: false}
      - {label: "Email do Cliente", name: "email_cliente", widget: "string", required: false}
      - {label: "Website (URL)", name: "website", widget: "string", required: false}
      - {label: "Morada", name: "address", widget: "string", required: false}
      - {label: "Imagem de Capa", name: "image", widget: "image"}
      
