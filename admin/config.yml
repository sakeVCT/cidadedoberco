backend:
  name: git-gateway
  branch: main
  site_domain: cidadedoberco.pt

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "empresas"
    label: "Empresas"
    folder: "content/empresas"
    create: true
    slug: "{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "Nome da Empresa", name: "title", widget: "string" }
      - { label: "Descrição", name: "body", widget: "markdown" }
      - { label: "Categoria", name: "category", widget: "select", options: ["Restauração", "Serviços", "Comércio", "Saúde"] }
      - { label: "Imagem", name: "image", widget: "image", required: false }
      - { label: "Telefone", name: "phone", widget: "string", required: false }
      - { label: "Morada", name: "address", widget: "string", required: false }
