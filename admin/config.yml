collections:
  - name: "eleitos"
    label: "Eleitos"
    folder: "content/eleitos"
    create: true
    fields:
      - {label: "Ordem de Exibição", name: "order", widget: "number", default: 10, help: "Quanto menor o número (ex: 1), mais acima aparece."}
      - {label: "Título (Nome)", name: "title", widget: "string"}
      - {label: "Categoria", name: "category", widget: "string"}
      - {label: "Imagem", name: "image", widget: "image"}
      - {label: "Descrição", name: "description", widget: "text"}
      - {label: "Telefone", name: "phone", widget: "string"}
      - {label: "Link Google Maps", name: "map_link", widget: "string"}
      - {label: "Nomeados", name: "nominees", widget: "string"}
