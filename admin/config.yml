backend:
  name: git-gateway
  branch: main

media_folder: "static/images"
public_folder: "/images"

publish_mode: simple

collections:
  - name: "empresas"
    label: "Empresas"
    folder: "content/empresas"
    create: true
    slug: "{{title}}"
    summary: "{{title}} | {{data_premium}}"
    editor:
      preview: false
    fields:
      - {label: "Título da Empresa", name: "title", widget: "string"}
      
      - label: "Categorias"
        name: "category"
        widget: "select"
        multiple: true
        options:
          - "Restaurantes"
          - "Pastelaria & Café"
          - "Tasca Típica"
          - "Bares & Vida Noturna"
          - "Moda & Acessórios"
          - "Artesanato"
          - "Cabeleireiro & Estética"
          - "Oficina Mecânica"
          - "Transportes"
          - "Saúde & Bem-Estar"
          - "Alojamento Local"
          - "Hotéis"
          - "Imobiliária"
          - "Outros"

      - {label: "Estatuto Premium", name: "premium", widget: "boolean", default: false}
      
      - label: "Data de Expiração (OBRIGATÓRIO PARA PREMIUM)"
        name: "data_premium"
        widget: "string"
        required: false
        hint: "⚠️ SE FOR PREMIUM: Coloque a data (Ex: 2026-12-31). SE NÃO FOR: Deixe vazio ou o site dará erro de destaque."
        # Esta linha abaixo ajuda a garantir que se escreveres algo, tem de ser uma data válida
        pattern: ['^\d{4}-\d{2}-\d{2}$', "Use o formato AAAA-MM-DD (ex: 2026-05-20) ou deixe vazio"]

      - {label: "Telemóvel/WhatsApp", name: "whatsapp", widget: "string", required: false}
      - {label: "Email", name: "email_cliente", widget: "string", required: false}
      - {label: "Website", name: "website", widget: "string", required: false}
      - {label: "Morada", name: "address", widget: "string", required: false}
      - {label: "Imagem", name: "image", widget: "image", required: false}
