backend:
  name: git-gateway
  branch: main

media_folder: "static/images"
public_folder: "/images"

publish_mode: simple

collections:
  - name: "empresas"
    label: "Empresas"
    folder: "content/empresas"
    create: true
    slug: "{{title}}"
    summary: "{{title}} | {{data_premium}}"
    editor:
      preview: false
    fields:
      - {label: "Título da Empresa", name: "title", widget: "string"}
      
      - label: "Categorias"
        name: "category"
        widget: "select"
        multiple: true
        options:
          - "Restaurantes"
          - "Pastelaria & Café"
          - "Tasca Típica"
          - "Bares & Vida Noturna"
          - "Moda & Acessórios"
          - "Artesanato"
          - "Cabeleireiro & Estética"
          - "Oficina Mecânica"
          - "Transportes"
          - "Saúde & Bem-Estar"
          - "Alojamento Local"
          - "Hotéis"
          - "Imobiliária"
          - "Outros"

      - {label: "Estatuto Premium", name: "premium", widget: "boolean", default: false}
      
      - label: "Data de Expiração (DD-MM-AAAA)"
        name: "data_premium"
        widget: "string"
        required: false
        hint: "⚠️ SE FOR PREMIUM: Use o formato DIA-MÊS-ANO (Ex: 20-05-2026). SE NÃO: Deixe vazio."
        # Novo padrão para aceitar DD-MM-AAAA
        pattern: ['^\d{2}-\d{2}-\d{4}$', "Use o formato DD-MM-AAAA (ex: 31-12-2026)"]

      - {label: "Telemóvel/WhatsApp", name: "whatsapp", widget: "string", required: false}
      - {label: "Email", name: "email_cliente", widget: "string", required: false}
      - {label: "Website", name: "website", widget: "string", required: false}
      - {label: "Morada", name: "address", widget: "string", required: false}
      - {label: "Imagem", name: "image", widget: "image", required: false}
