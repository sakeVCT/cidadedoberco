<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cidade do Berço | Business Directory</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --bg: #ffffff; 
            --card-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #666666;
            --accent: #2d3436; /* Cinza Ardósia Profissional */
            --premium-soft: #fcfaf7;
            --border: #f0f0f0;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            margin: 0; 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            color: var(--text-main); 
            -webkit-font-smoothing: antialiased;
        }

        /* HEADER PROFISSIONAL */
        header { 
            padding: 50px 20px 30px; 
            text-align: center; 
            max-width: 800px; 
            margin: 0 auto;
        }
        .logo { 
            font-family: 'Playfair Display', serif; 
            font-size: 1.8rem; 
            font-weight: 700; 
            letter-spacing: -0.5px;
            color: var(--text-main);
        }
        .logo span { color: #8e735b; } /* Tom bronze discreto */
        .tagline { 
            font-size: 0.7rem; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            color: var(--text-muted); 
            margin-top: 10px;
            font-weight: 400;
        }

        /* PESQUISA INTEGRADA */
        .search-container { 
            max-width: 700px; 
            margin: 0 auto 40px; 
            padding: 0 20px;
        }
        .search-wrapper { 
            display: flex; 
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding: 10px 0;
            transition: border-color 0.3s;
        }
        .search-wrapper:focus-within { border-color: var(--accent); }
        #searchInput { 
            flex: 1; 
            border: none; 
            padding: 10px; 
            font-size: 16px; 
            outline: none; 
            background: transparent;
            font-family: 'Inter', sans-serif;
        }

        /* FILTROS MINIMALISTAS */
        .filters { 
            display: flex; 
            gap: 15px; 
            overflow-x: auto; 
            padding: 20px 0; 
            scrollbar-width: none;
            mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
        }
        .filters::-webkit-scrollbar { display: none; }

        .filter-btn { 
            padding: 5px 0;
            background: transparent; 
            border: none;
            border-bottom: 2px solid transparent;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            white-space: nowrap; 
            flex-shrink: 0; 
            cursor: pointer;
            transition: 0.3s;
        }
        .filter-btn.active { 
            color: var(--text-main);
            border-bottom-color: var(--accent);
        }

        /* LISTA DE EMPRESAS */
        .container { max-width: 700px; margin: 0 auto 80px; padding: 0 20px; }
        
        .item { 
            display: flex; 
            padding: 30px 0; 
            border-bottom: 1px solid var(--border);
            gap: 25px;
            transition: opacity 0.3s;
        }
        .item.premium-active {
            /* Destaque premium é apenas um fundo muito suave */
            background-color: var(--premium-soft);
            margin-left: -20px;
            margin-right: -20px;
            padding-left: 20px;
            padding-right: 20px;
        }

        .img-box { 
            width: 80px; height: 80px; 
            border-radius: 4px; 
            overflow: hidden; 
            flex-shrink: 0; 
            background: #f9f9f9;
            border: 1px solid #f0f0f0;
            display: flex; align-items: center; justify-content: center;
        }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        .img-box i { font-size: 20px; color: #ddd; }

        .info { flex: 1; min-width: 0; }
        .premium-tag { 
            font-size: 9px; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            color: #8e735b;
            margin-bottom: 8px;
            display: block;
        }
        .item-title { 
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem; 
            font-weight: 700; 
            margin: 0 0 5px 0; 
            color: var(--text-main);
        }
        .item-meta {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .item-details { 
            font-size: 0.85rem; 
            color: var(--text-muted); 
            display: flex; flex-direction: column; gap: 6px;
        }
        .item-details span { display: flex; align-items: center; gap: 8px; }
        .item-details i { font-size: 12px; width: 14px; color: #ccc; }

        /* CONTACTOS DISCRETOS */
        .actions { 
            display: flex; 
            gap: 15px; 
            margin-top: 20px;
        }
        .btn-link { 
            text-decoration: none; 
            font-size: 11px; 
            font-weight: 700; 
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-main);
            display: flex; align-items: center; gap: 5px;
        }
        .btn-link i { font-size: 14px; }
        .btn-link.wa { color: #27ae60; }

        footer { text-align: center; padding: 60px 20px; font-size: 10px; color: #bbb; text-transform: uppercase; letter-spacing: 2px; }
    </style>
</head>
<body>
    <header>
        <div class="logo">Cidade do <span>Berço</span></div>
        <div class="tagline">The Guimarães Directory</div>
    </header>
    
    <div class="search-container">
        <div class="search-wrapper">
            <i class="fa-solid fa-magnifying-glass" style="color: #ccc; font-size: 14px;"></i>
            <input type="search" id="searchInput" placeholder="Pesquisar por nome ou setor..." oninput="executeSearch()">
        </div>
        <div class="filters" id="categoryFilters"></div>
    </div>

    <div class="container" id="results"></div>

    <footer>&copy; 2026 Guimarães Business Bureau</footer>

    <script>
        let database = [];
        let currentCat = "Todas";
        const normalize = (s) => s ? s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase() : "";

        async function loadData() {
            try {
                const res = await fetch('https://api.github.com/repos/Sakevct/cidadedoberco/contents/content/empresas');
                const files = await res.json();
                const items = [];
                const categories = new Set();
                for (let f of files) {
                    if (f.name.endsWith('.md')) {
                        const r = await fetch(f.download_url);
                        const t = await r.text();
                        const get = (re) => { const m = t.match(re); return m ? m[1].replace(/["']/g, '').trim() : ""; };
                        const catRaw = get(/category:\s*(.*)/) || "Geral";
                        const catsArray = catRaw.split(',').map(c => c.trim());
                        catsArray.forEach(c => { if(c) categories.add(c) });
                        let imgPath = get(/image:\s*(.*)/);
                        if (imgPath) imgPath = imgPath.replace(/^\.?\//, '');
                        items.push({
                            title: get(/title:\s*(.*)/) || "Empresa",
                            categories: catsArray,
                            image: imgPath,
                            whatsapp: get(/whatsapp:\s*(.*)/),
                            address: get(/address:\s*(.*)/),
                            website: get(/website:\s*(.*)/),
                            data_premium: get(/data_premium:\s*(.*)/),
                            premium: t.includes('premium: true') || t.includes('premium: "true"')
                        });
                    }
                }
                database = items;
                renderFilters(Array.from(categories));
                executeSearch();
            } catch (e) { console.error(e); }
        }

        function renderFilters(cats) {
            const f = document.getElementById('categoryFilters');
            f.innerHTML = `<button class="filter-btn active" onclick="filterByCat('Todas')">Todas</button>` + 
                cats.sort().map(c => `<button class="filter-btn" onclick="filterByCat('${c}')">${c}</button>`).join('');
        }

        function filterByCat(cat) {
            currentCat = cat;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.innerText === cat));
            executeSearch();
        }

        function render(list) {
            const container = document.getElementById('results');
            const hoje = new Date();
            hoje.setHours(0,0,0,0);

            container.innerHTML = list.length === 0 ? "<p style='text-align:center; padding:50px; color:#999; font-size:13px;'>Sem resultados para a sua pesquisa.</p>" : 
                list.map(item => {
                    let isPremiumReal = false;
                    if (item.premium === true || item.premium === "true") {
                        isPremiumReal = true;
                        if (item.data_premium && item.data_premium.includes('-')) {
                            const partes = item.data_premium.split('-');
                            const exp = new Date(partes[2], partes[1] - 1, partes[0]);
                            if (!isNaN(exp.getTime()) && exp < hoje) isPremiumReal = false;
                        }
                    }

                    return `
                    <div class="item ${isPremiumReal ? 'premium-active' : ''}">
                        <div class="img-box">
                            ${item.image ? `<img src="${item.image}">` : `<i class="fa-solid fa-shop"></i>`}
                        </div>
                        <div class="info">
                            ${isPremiumReal ? `<span class="premium-tag">Destaque Editorial</span>` : ''}
                            <h2 class="item-title">${item.title}</h2>
                            <div class="item-meta">${item.categories.join(' &nbsp;•&nbsp; ')}</div>
                            
                            <div class="item-details">
                                ${item.address ? `<span><i class="fa-solid fa-location-dot"></i> ${item.address}</span>` : ''}
                                ${item.website ? `<span><i class="fa-solid fa-arrow-up-right-from-square"></i> Consultar Website</span>` : ''}
                            </div>

                            ${isPremiumReal && item.whatsapp ? `
                            <div class="actions">
                                <a href="tel:+351${item.whatsapp}" class="btn-link"><i class="fa-solid fa-phone"></i> Ligar</a>
                                <a href="https://wa.me/351${item.whatsapp}" class="btn-link wa" target="_blank"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
                            </div>` : ''}
                        </div>
                    </div>
                    `;
                }).join('');
        }

        function executeSearch() {
            const query = normalize(document.getElementById('searchInput').value);
            let filtered = database;
            if (currentCat !== "Todas") filtered = filtered.filter(i => i.categories.includes(currentCat));
            if (query) filtered = filtered.filter(i => normalize(i.title + i.categories.join(' ') + i.address).includes(query));
            render(filtered.sort((a, b) => (b.premium === true) - (a.premium === true)));
        }
        window.onload = loadData;
    </script>
</body>
</html>
