<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidade do Berço | Curadoria Seleta</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --gold: #b38e5d; /* Dourado mate estilo joalharia */
            --dark: #121212;
            --light-gold: #f9f6f0;
        }

        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg);
            color: var(--dark);
        }

        /* Header Editorial */
        header {
            padding: 80px 20px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(3rem, 10vw, 5rem);
            line-height: 0.8;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: -2px;
        }

        .logo span { color: var(--gold); }

        .tagline {
            font-size: 0.8rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: var(--gold);
            font-weight: 500;
        }

        /* Pesquisa Inteligente */
        .search-area {
            max-width: 700px;
            margin: -35px auto 60px;
            padding: 0 20px;
        }

        #searchInput {
            width: 100%;
            padding: 25px 40px;
            border: 1px solid #e5e5e5;
            border-radius: 0; /* Design quadrado é mais editorial */
            font-size: 1rem;
            outline: none;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
            transition: 0.3s;
            font-family: 'Montserrat', sans-serif;
        }

        #searchInput:focus {
            border-color: var(--gold);
        }

        /* Grid Curadoria */
        .container {
            max-width: 1300px;
            margin: 0 auto 100px;
            padding: 0 30px;
        }

        #results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 60px 40px;
        }

        .curadoria-item {
            cursor: pointer;
            transition: 0.4s;
        }

        .img-container {
            aspect-ratio: 4/5; /* Formato retrato estilo revista */
            overflow: hidden;
            background: #f7f7f7;
            margin-bottom: 25px;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 1.2s cubic-bezier(0.2, 1, 0.2, 1);
        }

        .curadoria-item:hover img {
            transform: scale(1.05);
        }

        .category {
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 10px;
            display: block;
        }

        .title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            margin: 0 0 10px 0;
            font-weight: 600;
        }

        .address {
            font-size: 0.85rem;
            color: #888;
            font-weight: 300;
        }

        footer {
            padding: 100px 20px;
            background: var(--light-gold);
            text-align: center;
            font-size: 0.7rem;
            letter-spacing: 2px;
        }

        .admin-link { color: var(--gold); text-decoration: none; border-bottom: 1px solid; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Cidade do <span>Berço</span></div>
        <div class="tagline">The Guimarães Curated Directory</div>
    </header>

    <div class="search-area">
        <input type="text" id="searchInput" placeholder="PROCURE POR NOME, CATEGORIA OU CONCEITO..." onkeyup="filter()">
    </div>

    <div class="container">
        <div id="results">
            </div>
    </div>

    <footer>
        &copy; 2026 CIDADE DO BERÇO &bull; GUIMARÃES, PORTUGAL<br><br>
        <a href="/admin/" class="admin-link">CURATOR ACCESS</a>
    </footer>

    <script>
        let allItems = [];

        // Dicionário de Sinónimos para pesquisa inteligente
        const synonyms = {
            "lanchar": ["café", "cafetaria", "pastelaria", "padaria", "lanche", "doce"],
            "comer": ["restaurante", "jantar", "almoço", "gastronomia", "comida"],
            "beber": ["bar", "cocktail", "vinhos", "pub", "noite"],
            "dormir": ["hotel", "alojamento", "pousada", "turismo"]
        };

        // Função para remover acentos
        const normalize = (str) => str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

        async function load() {
            try {
                const res = await fetch('https://api.github.com/repos/Sakevct/cidadedoberco/contents/content/empresas');
                const files = await res.json();
                
                for (let f of files) {
                    if (f.name.endsWith('.md')) {
                        const r = await fetch(f.download_url);
                        const t = await r.text();
                        
                        const get = (regex, def) => {
                            const m = t.match(regex);
                            return m ? m[1].replace(/"/g,'').trim() : def;
                        };

                        allItems.push({
                            title: get(/title:\s*(.*)/, "Untitled"),
                            category: get(/category:\s*(.*)/, "General"),
                            image: get(/image:\s*(.*)/, "https://images.unsplash.com/photo-1497366216548-37526070297c?w=800"),
                            address: get(/address:\s*(.*)/, "Guimarães, PT")
                        });
                    }
                }
                show(allItems);
            } catch (e) { console.error(e); }
        }

        function show(list) {
            const grid = document.getElementById('results');
            grid.innerHTML = list.map(item => `
                <div class="curadoria-item">
                    <div class="img-container">
                        <img src="${item.image}" onerror="this.src='https://images.unsplash.com/photo-1497366216548-37526070297c?w=800'">
                    </div>
                    <span class="category">${item.category}</span>
                    <h2 class="title">${item.title}</h2>
                    <div class="address">📍 ${item.address}</div>
                </div>
            `).join('');
        }

        function filter() {
            const query = normalize(document.getElementById('searchInput').value);
            
            const filtered = allItems.filter(item => {
                const title = normalize(item.title);
                const cat = normalize(item.category);
                
                // Verifica título ou categoria diretamente
                if (title.includes(query) || cat.includes(query)) return true;

                // Verifica sinónimos
                for (let key in synonyms) {
                    if (query.includes(key)) {
                        return synonyms[key].some(s => cat.includes(normalize(s)));
                    }
                }
                return false;
            });
            
            show(filtered);
        }

        window.onload = load;
    </script>
</body>
</html>
