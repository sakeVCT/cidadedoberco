<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidade do Berço | Curadoria</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@300;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #ffffff; --gold: #b38e5d; --dark: #121212; --light-gray: #f2f2f2; }
        
        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: var(--dark); }

        /* Header mais pequeno e elegante */
        header { padding: 30px 20px 20px; text-align: center; }
        .logo { font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; text-transform: uppercase; margin: 0; letter-spacing: -1px; }
        .logo span { color: var(--gold); }
        .tagline { font-size: 0.6rem; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); margin-top: 5px; }

        /* Barra de Busca Slim */
        .search-area { max-width: 500px; margin: 20px auto 30px; padding: 0 15px; display: flex; }
        #searchInput { 
            flex: 1; padding: 12px 15px; border: 1px solid #ddd; border-right: none;
            font-size: 14px; outline: none; border-radius: 4px 0 0 4px;
        }
        .search-btn { 
            background: var(--gold); color: white; border: none; padding: 0 15px;
            font-size: 11px; text-transform: uppercase; font-weight: 600; border-radius: 0 4px 4px 0; cursor: pointer;
        }

        /* Grelha Compacta (O segredo para ver 5+ negócios) */
        .container { max-width: 1200px; margin: 0 auto 60px; padding: 0 10px; }
        #results { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); /* 5 colunas no PC */
            gap: 20px 15px; 
        }

        /* Ajuste para Tablets */
        @media (max-width: 1024px) {
            #results { grid-template-columns: repeat(3, 1fr); }
        }

        /* Ajuste para Telemóveis (Mostra 2 por linha = 4 a 6 visíveis logo) */
        @media (max-width: 600px) {
            #results { grid-template-columns: repeat(2, 1fr); gap: 15px 10px; }
            .logo { font-size: 1.8rem; }
            header { padding-top: 20px; }
        }

        .item { text-decoration: none; color: inherit; transition: 0.3s; }
        
        .img-box { 
            aspect-ratio: 1/1; 
            overflow: hidden; 
            background: var(--light-gray); 
            border-radius: 2px; /* Cantos quase retos para ser mais chique */
            margin-bottom: 10px;
        }
        .img-box img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .item:hover img { transform: scale(1.08); }

        .cat { font-size: 0.55rem; letter-spacing: 1px; text-transform: uppercase; color: var(--gold); font-weight: 600; }
        .name { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; margin: 3px 0; font-weight: 700; line-height: 1.2; }
        .loc { font-size: 0.7rem; color: #888; display: flex; align-items: center; gap: 3px; }

        footer { padding: 40px 20px; text-align: center; border-top: 1px solid #eee; font-size: 10px; letter-spacing: 1px; color: #aaa; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Cidade do <span>Berço</span></div>
        <div class="tagline">Guimarães Curated Selection</div>
    </header>

    <div class="search-area">
        <input type="search" id="searchInput" placeholder="O QUE PROCURA?">
        <button type="button" id="searchBtn" class="search-btn">BUSCAR</button>
    </div>

    <div class="container">
        <div id="results">
            </div>
    </div>

    <footer>
        &copy; 2026 CIDADE DO BERÇO &bull; <a href="/admin/" style="color:inherit; text-decoration:none;">ADMIN</a>
    </footer>

    <script>
        let allData = [];
        const normalize = (s) => s ? s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase() : "";

        async function load() {
            try {
                const res = await fetch('https://api.github.com/repos/Sakevct/cidadedoberco/contents/content/empresas');
                const files = await res.json();
                for (let f of files) {
                    if (f.name.endsWith('.md')) {
                        const r = await fetch(f.download_url);
                        const t = await r.text();
                        const get = (re) => { const m = t.match(re); return m ? m[1].replace(/"/g,'').trim() : ""; };
                        allData.push({
                            title: get(/title:\s*(.*)/) || "Empresa",
                            category: get(/category:\s*(.*)/) || "Geral",
                            image: get(/image:\s*(.*)/) || "https://images.unsplash.com/photo-1497366216548-37526070297c?w=400",
                            address: get(/address:\s*(.*)/) || "Guimarães"
                        });
                    }
                }
                show(allData);
            } catch (e) { console.log(e); }
        }

        function show(list) {
            document.getElementById('results').innerHTML = list.map(item => `
                <div class="item">
                    <div class="img-box">
                        <img src="${item.image}" onerror="this.src='https://images.unsplash.com/photo-1497366216548-37526070297c?w=400'">
                    </div>
                    <span class="cat">${item.category}</span>
                    <h2 class="name">${item.title}</h2>
                    <div class="loc">📍 ${item.address}</div>
                </div>
            `).join('');
        }

        function runSearch() {
            const q = normalize(document.getElementById('searchInput').value);
            show(allData.filter(i => normalize(i.title).includes(q) || normalize(i.category).includes(q)));
        }

        document.getElementById('searchBtn').addEventListener('click', runSearch);
        document.getElementById('searchInput').addEventListener('keypress', (e) => { if(e.key==='Enter') runSearch(); });
        
        window.onload = load;
    </script>
</body>
</html>
