<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidade do Berço | Top 2026</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --bg: #ffffff; --gold: #b38e5d; --dark: #000000; --elite: #fdfaf3; --border: #eee; }
        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--dark); min-height: 100vh; display: flex; flex-direction: column; }
        header { padding: 30px 20px; text-align: center; background: var(--dark); color: #fff; border-bottom: 5px solid var(--gold); }
        .logo { font-family: 'Cormorant Garamond', serif; font-size: 2rem; text-transform: uppercase; letter-spacing: 3px; margin: 0; }
        .logo span { color: var(--gold); }
        .tagline { font-size: 0.6rem; letter-spacing: 5px; text-transform: uppercase; color: var(--gold); margin-top: 8px; font-weight: 700; }
        .search-container { max-width: 600px; margin: -25px auto 30px; padding: 0 20px; position: relative; z-index: 10; }
        .search-wrapper { display: flex; background: white; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 1px solid var(--gold); }
        #searchInput { flex: 1; border: none; padding: 15px; font-size: 15px; outline: none; width: 100%; }
        .filters { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
        .filter-btn { padding: 6px 14px; background: #f4f4f4; border: 1px solid #ddd; border-radius: 20px; font-size: 10px; text-transform: uppercase; font-weight: 700; cursor: pointer; white-space: nowrap; }
        .filter-btn.active { background: var(--gold); color: white; border-color: var(--gold); }
        .container { max-width: 750px; margin: 0 auto 60px; padding: 0 15px; width: 100%; flex-grow: 1; box-sizing: border-box; }
        .item { display: flex; align-items: center; padding: 18px 15px; border-bottom: 1px solid var(--border); background: white; gap: 15px; }
        .item.premium-active { background: var(--elite); border-left: 4px solid var(--gold); }
        .img-box { width: 65px; height: 65px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: #eee; border: 1px solid #eee; }
        .premium-active .img-box { width: 85px; height: 85px; border-radius: 12px; border: 1.5px solid var(--gold); }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        .info { flex: 1; min-width: 0; }
        .status { font-size: 8px; text-transform: uppercase; color: var(--gold); font-weight: 800; display: flex; align-items: center; gap: 4px; }
        .item-cat { font-size: 0.65rem; color: var(--gold); text-transform: uppercase; font-weight: 700; }
        .item-title { font-family: 'Cormorant Garamond', serif; font-size: 1.3rem; margin: 2px 0 6px 0; font-weight: 700; line-height: 1.1; }
        .item-details { font-size: 0.75rem; color: #666; display: flex; flex-direction: column; gap: 4px; }
        .item-details span, .item-details a { display: flex; align-items: center; gap: 8px; text-decoration: none; color: inherit; }
        .item-details i { color: var(--gold); width: 14px; text-align: center; }
        .contact-area { display: flex; flex-direction: column; gap: 10px; }
        .contact-btn { color: white; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 18px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .contact-btn.call { background: var(--gold); }
        .contact-btn.whatsapp { background: #25d366; }
        footer { padding: 40px 20px; text-align: center; background: #f9f9f9; border-top: 1px solid #eee; font-size: 9px; letter-spacing: 2px; color: #aaa; margin-top: auto; }
    </style>
</head>
<body>
    <header><div class="logo">Cidade do <span>Berço</span></div><div class="tagline">O Ranking Exclusivo</div></header>
    <div class="search-container">
        <form class="search-wrapper" onsubmit="event.preventDefault();"><input type="search" id="searchInput" placeholder="Pesquisar..." oninput="executeSearch()"></form>
        <div class="filters" id="categoryFilters"></div>
    </div>
    <div class="container"><div id="results"></div></div>
    <footer>&copy; 2026 CIDADE DO BERÇO &bull; <a href="/admin/" style="color:inherit">ADMIN</a></footer>

    <script>
        let database = [];
        let currentCat = "Todas";
        const normalize = (s) => s ? s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase() : "";

        async function loadData() {
            try {
                const res = await fetch('https://api.github.com/repos/Sakevct/cidadedoberco/contents/content/empresas');
                const files = await res.json();
                const items = [];
                const categories = new Set();
                for (let f of files) {
                    if (f.name.endsWith('.md')) {
                        const r = await fetch(f.download_url);
                        const t = await r.text();
                        const get = (re) => { const m = t.match(re); return m ? m[1].replace(/["']/g, '').trim() : ""; };
                        const catRaw = get(/category:\s*(.*)/) || "Geral";
                        const catsArray = catRaw.split(',').map(c => c.trim());
                        catsArray.forEach(c => categories.add(c));
                        let imgPath = get(/image:\s*(.*)/);
                        if (imgPath) imgPath = imgPath.replace(/^\.?\//, '');
                        items.push({
                            title: get(/title:\s*(.*)/) || "Empresa",
                            categories: catsArray,
                            image: imgPath,
                            whatsapp: get(/whatsapp:\s*(.*)/),
                            address: get(/address:\s*(.*)/),
                            email_cliente: get(/email_cliente:\s*(.*)/),
                            website: get(/website:\s*(.*)/),
                            premium: t.includes('premium: true') || t.includes('premium: "true"')
                        });
                    }
                }
                database = items;
                renderFilters(Array.from(categories));
                executeSearch();
            } catch (e) { console.error(e); }
        }

        function renderFilters(cats) {
            const f = document.getElementById('categoryFilters');
            f.innerHTML = `<button class="filter-btn active" onclick="filterByCat('Todas')">Todas</button>` + 
                cats.sort().map(c => `<button class="filter-btn" onclick="filterByCat('${c}')">${c}</button>`).join('');
        }

        function filterByCat(cat) {
            currentCat = cat;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.innerText === cat));
            executeSearch();
        }

        function render(list) {
            const container = document.getElementById('results');
            container.innerHTML = list.length === 0 ? "<p style='text-align:center; padding:50px;'>Sem resultados.</p>" : 
                list.map(item => `
                <div class="item ${item.premium ? 'premium-active' : ''}">
                    <div class="img-box"><img src="${item.image}" onerror="this.src='https://via.placeholder.com/150?text=Logo'"></div>
                    <div class="info">
                        ${item.premium ? `<span class="status"><i class="fa-solid fa-star"></i> Seleção Premium</span>` : ''}
                        <div class="item-cat">${item.categories.join(', ')}</div>
                        <h2 class="item-title">${item.title}</h2>
                        <div class="item-details">
                            ${item.address ? `<span><i class="fa-solid fa-location-dot"></i> ${item.address}</span>` : ''}
                            ${item.email_cliente ? `<span><i class="fa-solid fa-envelope"></i> ${item.email_cliente}</span>` : ''}
                            ${item.website ? `<a href="${item.website.startsWith('http') ? item.website : 'https://' + item.website}" target="_blank"><i class="fa-solid fa-globe"></i> Website</a>` : ''}
                        </div>
                    </div>
                    ${(item.premium && item.whatsapp) ? `
                    <div class="contact-area">
                        <a href="tel:+351${item.whatsapp}" class="contact-btn call"><i class="fa-solid fa-phone"></i></a>
                        <a href="https://wa.me/351${item.whatsapp}" class="contact-btn whatsapp" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>
                    </div>` : ''}
                </div>
            `).join('');
        }

        function executeSearch() {
            const query = normalize(document.getElementById('searchInput').value);
            let filtered = database;
            if (currentCat !== "Todas") filtered = filtered.filter(i => i.categories.includes(currentCat));
            if (query) filtered = filtered.filter(i => normalize(i.title + i.categories.join(' ') + i.address).includes(query));
            render(filtered.sort((a, b) => b.premium - a.premium));
        }
        window.onload = loadData;
    </script>
</body>
</html>
