<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidade do Berço | Curadoria</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@300;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #ffffff; --gold: #b38e5d; --dark: #121212; --light-gray: #f9f9f9; --border: #eee; }
        
        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: var(--dark); -webkit-font-smoothing: antialiased; }

        /* Header Slim */
        header { padding: 25px 15px 15px; text-align: center; border-bottom: 1px solid var(--border); background: var(--light-gray); }
        .logo { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; text-transform: uppercase; margin: 0; letter-spacing: -1px; line-height: 1; }
        .logo span { color: var(--gold); }
        .tagline { font-size: 0.55rem; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); margin-top: 5px; opacity: 0.8; }

        /* Busca Ultra Slim */
        .search-area { max-width: 400px; margin: 15px auto 25px; padding: 0 15px; display: flex; gap: 5px; }
        #searchInput { 
            flex: 1; padding: 10px 15px; border: 1px solid #ddd; 
            font-size: 13px; outline: none; border-radius: 3px; background: #fff;
        }
        .search-btn { 
            background: var(--dark); color: white; border: none; padding: 0 15px;
            font-size: 10px; text-transform: uppercase; font-weight: 600; border-radius: 3px; cursor: pointer;
            transition: 0.3s;
        }
        .search-btn:hover { background: var(--gold); }

        /* Lista Compacta */
        .container { max-width: 800px; margin: 0 auto 50px; padding: 0 10px; }
        
        #results { display: flex; flex-direction: column; gap: 0; /* Colados para densidade */ }

        .item { 
            display: flex; 
            align-items: center; 
            text-decoration: none; 
            color: inherit; 
            padding: 15px 10px; 
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
        }
        .item:hover { background-color: var(--light-gray); }

        /* Imagem BEM mais pequena */
        .img-box { 
            width: 60px; /* Largura fixa e pequena */
            height: 60px; /* Altura fixa e pequena (Quadrado) */
            overflow: hidden; 
            background: #eee; 
            border-radius: 4px; 
            margin-right: 15px;
            flex-shrink: 0; /* Impede a imagem de encolher */
        }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }

        /* Textos alinhados à direita da foto */
        .content-box { flex: 1; display: flex; flex-direction: column; justify-content: center; }

        .cat { font-size: 0.5rem; letter-spacing: 1px; text-transform: uppercase; color: var(--gold); font-weight: 600; margin-bottom: 2px; }
        .name { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; margin: 0; font-weight: 700; line-height: 1.1; color: var(--dark); }
        .loc { font-size: 0.65rem; color: #888; margin-top: 3px; display: flex; align-items: center; gap: 3px; }

        @media (max-width: 600px) {
            .name { font-size: 1.1rem; }
            .img-box { width: 50px; height: 50px; margin-right: 12px; } /* Ainda mais pequenas no mobile */
            header { padding-top: 15px; }
        }

        footer { padding: 30px 20px; text-align: center; border-top: 1px solid var(--border); font-size: 9px; letter-spacing: 1px; color: #bbb; background: var(--light-gray); }
    </style>
</head>
<body>

    <header>
        <div class="logo">Cidade do <span>Berço</span></div>
        <div class="tagline">Guimarães Curated Directory</div>
    </header>

    <div class="search-area">
        <input type="search" id="searchInput" placeholder="O QUE PROCURA?">
        <button type="button" id="searchBtn" class="search-btn">BUSCAR</button>
    </div>

    <div class="container">
        <div id="results">
            </div>
    </div>

    <footer>
        &copy; 2026 CIDADE DO BERÇO &bull; <a href="/admin/" style="color:inherit; text-decoration:none;">GESTÃO</a>
    </footer>

    <script>
        let allData = [];
        const normalize = (s) => s ? s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase() : "";

        async function load() {
            try {
                const res = await fetch('https://api.github.com/repos/Sakevct/cidadedoberco/contents/content/empresas');
                const files = await res.json();
                for (let f of files) {
                    if (f.name && f.name.endsWith('.md')) {
                        const r = await fetch(f.download_url);
                        const t = await r.text();
                        const get = (re) => { const m = t.match(re); return m ? m[1].replace(/"/g,'').trim() : ""; };
                        allData.push({
                            title: get(/title:\s*(.*)/) || "Empresa",
                            category: get(/category:\s*(.*)/) || "Geral",
                            image: get(/image:\s*(.*)/) || "https://images.unsplash.com/photo-1497366216548-37526070297c?w=100",
                            address: get(/address:\s*(.*)/) || "Guimarães"
                        });
                    }
                }
                show(allData);
            } catch (e) { console.log(e); }
        }

        function show(list) {
            document.getElementById('results').innerHTML = list.map(item => `
                <div class="item">
                    <div class="img-box">
                        <img src="${item.image}" onerror="this.src='https://images.unsplash.com/photo-1497366216548-37526070297c?w=100'">
                    </div>
                    <div class="content-box">
                        <span class="cat">${item.category}</span>
                        <h2 class="name">${item.title}</h2>
                        <div class="loc">📍 ${item.address}</div>
                    </div>
                </div>
            `).join('');
        }

        function runSearch() {
            const q = normalize(document.getElementById('searchInput').value);
            show(allData.filter(i => normalize(i.title).includes(q) || normalize(i.category).includes(q)));
        }

        document.getElementById('searchBtn').addEventListener('click', runSearch);
        document.getElementById('searchInput').addEventListener('keypress', (e) => { if(e.key==='Enter') runSearch(); });
        
        window.onload = load;
    </script>
</body>
</html>
