<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidade do Berço | O trono só tem um lugar</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Plus+Jakarta+Sans:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <style>
        :root { --gold: #c5a059; --dark: #0a0a0a; --accent: #1a1a1a; }
        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: #fff; color: var(--dark); overflow-x: hidden; }
        
        header { 
            /* Reduzido de 80px para 70px para aproximar do topo */
            padding: 70px 15px 60px; 
            text-align: center; 
            background: var(--dark); 
            color: white; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-main { 
            font-family: 'Cormorant Garamond', serif; 
            font-size: 2.8rem; 
            letter-spacing: 7px; 
            text-transform: uppercase; 
            margin: 0; 
            font-weight: 600; 
            color: #fff; 
            white-space: nowrap;
        }

        .slogan { 
            font-size: 0.75rem; 
            letter-spacing: 8px; 
            color: var(--gold); 
            margin-top: 20px; 
            font-weight: 300; 
            text-transform: uppercase; 
        }

        .container { max-width: 1000px; margin: 0 auto 40px; padding: 0 15px; }
        .category-wrapper { padding: 60px 0 40px 0; border-bottom: 1px solid #f0f0f0; }
        .election-header { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; padding: 0 5px; }
        .winner-name { font-family: 'Cormorant Garamond', serif; font-size: 2.6rem; color: var(--dark); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; line-height: 1.1; margin: 0; }
        
        .category-info { display: flex; align-items: center; gap: 12px; }
        .badge-throne { background: var(--dark); color: var(--gold); font-size: 0.65rem; letter-spacing: 3px; padding: 5px 14px; border-radius: 4px; font-weight: 600; text-transform: uppercase; border: 1px solid var(--gold); }
        .cat-label { font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: 2px; font-weight: 300; }

        .card { background: var(--dark); border-radius: 24px; overflow: hidden; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.12); cursor: pointer; }
        .card-img { width: 100%; height: 500px; object-fit: cover; display: block; filter: grayscale(10%); transition: 0.5s; }
        .card:hover .card-img { filter: grayscale(0%); transform: scale(1.02); }
        
        .card-actions-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 35px; background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%); display: flex; gap: 15px; }

        .description-box { padding: 25px 10px; font-size: 0.8rem; color: #444; line-height: 1.8; font-weight: 400; text-transform: uppercase; letter-spacing: 1.2px; text-align: justify; }
        
        .btn { flex: 1; text-align: center; padding: 18px; border-radius: 12px; text-decoration: none; font-weight: 600; font-size: 0.75rem; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; }
        .btn-gold { background: var(--gold); color: #000; }
        .btn-outline { border: 1px solid rgba(255,255,255,0.4); color: white; backdrop-filter: blur(8px); }

        .nominees { margin-top: 15px; padding: 15px; background: #fafafa; border-radius: 12px; color: #bbb; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.5px; }
        .nominees b { color: #999; margin-right: 8px; font-weight: 600; letter-spacing: 2px; }

        footer { text-align: center; padding: 100px 20px 60px; background: #fafafa; border-top: 1px solid #eee; }
        .footer-logo { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; color: var(--gold); letter-spacing: 4px; text-transform: uppercase; margin-bottom: 25px; display: block; text-decoration: none; font-weight: 600; }
        .footer-nav a { color: #888; text-decoration: none; font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; border-bottom: 1px solid #ddd; padding-bottom: 5px; }

        #lightbox { display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); align-items: center; justify-content: center; }
        #lightbox.active { display: flex; }
        #lightbox img { max-width: 90%; max-height: 80%; border-radius: 15px; border: 1px solid var(--gold); }

        @media (max-width: 600px) { 
            /* Ajuste também para mobile para manter a consistência */
            header { padding: 50px 15px 40px; }
            .logo-main { font-size: 1.8rem; letter-spacing: 4px; } 
            .winner-name { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo-main">Cidade do Berço</div>
    <div class="slogan">O trono só tem um lugar</div>
</header>

<div class="container" id="eleitos-container"></div>

<footer>
    <a href="index.html" class="footer-logo">Cidade do Berço</a>
    <div class="footer-nav">
        <a href="sobre.html">Conheça a Essência do Trono</a>
    </div>
</footer>

<div id="lightbox" onclick="this.classList.remove('active')"><img id="lightbox-img" src=""></div>

<script>
    const user = "sakevct"; 
    const repo = "cidadedoberco";
    const folder = "content/eleitos";

    async function loadContent() {
        const container = document.getElementById('eleitos-container');
        const ts = new Date().getTime(); 
        try {
            const response = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${folder}?v=${ts}`);
            const files = await response.json();
            const mdFiles = files.filter(f => f.name.endsWith('.md'));
            let allPosts = [];

            for (const file of mdFiles) {
                const fileRes = await fetch(`${file.download_url}?v=${ts}`);
                const text = await fileRes.text();
                const parts = text.split('---');
                if (parts.length < 3) continue;
                allPosts.push(jsyaml.load(parts[1]));
            }

            allPosts.sort((a, b) => {
                const getNum = (t) => parseInt(t.toString().match(/^\d+/) || 999);
                return getNum(a.title) - getNum(b.title);
            });

            container.innerHTML = ''; 
            allPosts.forEach(content => {
                let cleanTitle = content.title.toString().replace(/^\d+\s*[-_]?\s*/, '');
                container.innerHTML += `
                    <div class="category-wrapper">
                        <div class="election-header">
                            <h2 class="winner-name">${cleanTitle}</h2>
                            <div class="category-info">
                                <span class="badge-throne">NO TRONO</span>
                                <span class="cat-label">${content.category || ''}</span>
                            </div>
                        </div>
                        <div class="card" onclick="openLightbox('${content.image}')">
                            <img src="${content.image}" class="card-img">
                            <div class="card-actions-overlay">
                                <a href="tel:${content.phone}" class="btn btn-gold" onclick="event.stopPropagation()"><i class="fa-solid fa-phone"></i> CONTACTO</a>
                                <a href="${content.map_link}" target="_blank" class="btn btn-outline" onclick="event.stopPropagation()"><i class="fa-solid fa-location-dot"></i> MAPA</a>
                            </div>
                        </div>
                        <div class="description-box">${content.description || ''}</div>
                        <div class="nominees"><b>CANDIDATOS:</b> ${content.nominees || ''}</div>
                    </div>
                `;
            });
        } catch (e) { container.innerHTML = '<p style="text-align:center; padding:100px;">A preparar o reino...</p>'; }
    }
    function openLightbox(src) { document.getElementById('lightbox-img').src = src; document.getElementById('lightbox').classList.add('active'); }
    loadContent();
</script>
</body>
</html>
