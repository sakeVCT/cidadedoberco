<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GMR City Guide | 2026</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --bg: #0f1115; 
            --card: #1a1d23; 
            --accent: #3b82f6; 
            --text: #ffffff; 
            --text-dim: #94a3b8;
            --premium: #fbbf24;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            margin: 0; 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            line-height: 1.5;
        }

        /* HEADER MODERNO */
        header { 
            padding: 40px 20px; 
            text-align: left; 
            max-width: 750px; 
            margin: 0 auto;
        }
        .logo { font-size: 1.8rem; font-weight: 800; letter-spacing: -1px; }
        .logo span { color: var(--accent); }
        .tagline { font-size: 0.85rem; color: var(--text-dim); margin-top: 5px; }

        /* SEARCH BAR ESTILO APP */
        .search-container { 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            background: var(--bg); 
            padding: 10px 15px 20px;
            max-width: 750px;
            margin: 0 auto;
        }
        .search-wrapper { 
            display: flex; 
            background: var(--card); 
            border-radius: 12px; 
            padding: 5px 15px;
            border: 1px solid #2d333f;
        }
        #searchInput { 
            flex: 1; 
            border: none; 
            padding: 12px; 
            font-size: 16px; 
            outline: none; 
            background: transparent; 
            color: white; 
        }

        /* FILTROS MINIMALISTAS */
        .filters { 
            display: flex; 
            gap: 10px; 
            overflow-x: auto; 
            padding: 15px 0; 
            scrollbar-width: none; 
            mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
        }
        .filters::-webkit-scrollbar { display: none; }

        .filter-btn { 
            padding: 8px 16px;
            background: var(--card); 
            border: 1px solid #2d333f;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-dim);
            white-space: nowrap; 
            flex-shrink: 0; 
            transition: 0.3s;
        }
        .filter-btn.active { 
            background: var(--accent); 
            color: white; 
            border-color: var(--accent);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        /* LISTA DE CARTÕES */
        .container { max-width: 750px; margin: 0 auto 100px; padding: 0 15px; }
        
        .item { 
            background: var(--card); 
            border-radius: 16px; 
            padding: 20px; 
            margin-bottom: 15px; 
            display: flex; 
            flex-direction: column;
            border: 1px solid #2d333f;
            position: relative;
            transition: transform 0.2s;
        }
        .item.premium-active { 
            border: 1px solid rgba(251, 191, 36, 0.3);
            background: linear-gradient(145deg, #1a1d23 0%, #1e232b 100%);
        }

        .item-top { display: flex; gap: 15px; align-items: center; }

        .img-box { 
            width: 70px; height: 70px; 
            border-radius: 14px; 
            overflow: hidden; 
            flex-shrink: 0; 
            background: #2d333f;
            display: flex; align-items: center; justify-content: center;
        }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        .img-box i { font-size: 24px; color: #4b5563; }

        .info { flex: 1; }
        .premium-badge { 
            font-size: 10px; 
            color: var(--premium); 
            font-weight: 700; 
            text-transform: uppercase; 
            display: flex; align-items: center; gap: 4px; 
            margin-bottom: 4px;
        }
        .item-title { font-size: 1.2rem; font-weight: 700; margin: 0; letter-spacing: -0.5px; }
        
        .item-details { 
            margin-top: 12px; 
            padding-top: 12px; 
            border-top: 1px solid #2d333f;
            font-size: 0.85rem; 
            color: var(--text-dim); 
            display: flex; flex-direction: column; gap: 8px;
        }
        .item-details span { display: flex; align-items: center; gap: 10px; }
        .item-details i { color: var(--accent); width: 16px; }

        /* BOTÕES DE ACÇÃO */
        .actions { 
            display: flex; 
            gap: 10px; 
            margin-top: 15px;
        }
        .btn-action { 
            flex: 1; 
            padding: 10px; 
            border-radius: 10px; 
            text-align: center; 
            text-decoration: none; 
            font-size: 13px; 
            font-weight: 600; 
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-call { background: #2d333f; color: white; }
        .btn-wa { background: #25d366; color: white; }

        footer { text-align: center; padding: 40px; font-size: 12px; color: var(--text-dim); }
    </style>
</head>
<body>
    <header>
        <div class="logo">Guimarães<span>Hub</span></div>
        <div class="tagline">O teu guia digital da cidade</div>
    </header>
    
    <div class="search-container">
        <div class="search-wrapper">
            <i class="fa-solid fa-magnifying-glass" style="align-self: center; color: var(--text-dim)"></i>
            <input type="search" id="searchInput" placeholder="O que procuras?" oninput="executeSearch()">
        </div>
        <div class="filters" id="categoryFilters"></div>
    </div>

    <div class="container" id="results"></div>

    <footer>&copy; 2026 Guimarães Hub</footer>

    <script>
        let database = [];
        let currentCat = "Todas";
        const normalize = (s) => s ? s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase() : "";

        async function loadData() {
            try {
                const res = await fetch('https://api.github.com/repos/Sakevct/cidadedoberco/contents/content/empresas');
                const files = await res.json();
                const items = [];
                const categories = new Set();
                for (let f of files) {
                    if (f.name.endsWith('.md')) {
                        const r = await fetch(f.download_url);
                        const t = await r.text();
                        const get = (re) => { const m = t.match(re); return m ? m[1].replace(/["']/g, '').trim() : ""; };
                        const catRaw = get(/category:\s*(.*)/) || "Geral";
                        const catsArray = catRaw.split(',').map(c => c.trim());
                        catsArray.forEach(c => { if(c) categories.add(c) });
                        let imgPath = get(/image:\s*(.*)/);
                        if (imgPath) imgPath = imgPath.replace(/^\.?\//, '');
                        items.push({
                            title: get(/title:\s*(.*)/) || "Empresa",
                            categories: catsArray,
                            image: imgPath,
                            whatsapp: get(/whatsapp:\s*(.*)/),
                            address: get(/address:\s*(.*)/),
                            website: get(/website:\s*(.*)/),
                            data_premium: get(/data_premium:\s*(.*)/),
                            premium: t.includes('premium: true') || t.includes('premium: "true"')
                        });
                    }
                }
                database = items;
                renderFilters(Array.from(categories));
                executeSearch();
            } catch (e) { console.error(e); }
        }

        function renderFilters(cats) {
            const f = document.getElementById('categoryFilters');
            f.innerHTML = `<button class="filter-btn active" onclick="filterByCat('Todas')">Todas</button>` + 
                cats.sort().map(c => `<button class="filter-btn" onclick="filterByCat('${c}')">${c}</button>`).join('');
        }

        function filterByCat(cat) {
            currentCat = cat;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.innerText === cat));
            executeSearch();
        }

        function render(list) {
            const container = document.getElementById('results');
            const hoje = new Date();
            hoje.setHours(0,0,0,0);

            container.innerHTML = list.length === 0 ? "<p style='text-align:center; padding:50px; color:var(--text-dim)'>Nenhum resultado encontrado.</p>" : 
                list.map(item => {
                    let isPremiumReal = false;
                    if (item.premium === true || item.premium === "true") {
                        isPremiumReal = true;
                        if (item.data_premium && item.data_premium.includes('-')) {
                            const partes = item.data_premium.split('-');
                            const exp = new Date(partes[2], partes[1] - 1, partes[0]);
                            if (!isNaN(exp.getTime()) && exp < hoje) isPremiumReal = false;
                        }
                    }

                    return `
                    <div class="item ${isPremiumReal ? 'premium-active' : ''}">
                        <div class="item-top">
                            <div class="img-box">
                                ${item.image ? `<img src="${item.image}">` : `<i class="fa-solid fa-store"></i>`}
                            </div>
                            <div class="info">
                                ${isPremiumReal ? `<div class="premium-badge"><i class="fa-solid fa-crown"></i> Recomendado</div>` : ''}
                                <h2 class="item-title">${item.title}</h2>
                                <div style="font-size: 11px; color: var(--accent); font-weight: 600; margin-top: 4px;">${item.categories.join(' • ')}</div>
                            </div>
                        </div>
                        
                        <div class="item-details">
                            ${item.address ? `<span><i class="fa-solid fa-location-dot"></i> ${item.address}</span>` : ''}
                            ${item.website ? `<span><i class="fa-solid fa-link"></i> ${item.website}</span>` : ''}
                        </div>

                        ${isPremiumReal && item.whatsapp ? `
                        <div class="actions">
                            <a href="tel:+351${item.whatsapp}" class="btn-action btn-call"><i class="fa-solid fa-phone"></i> Ligar</a>
                            <a href="https://wa.me/351${item.whatsapp}" class="btn-action btn-wa" target="_blank"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
                        </div>` : ''}
                    </div>
                    `;
                }).join('');
        }

        function executeSearch() {
            const query = normalize(document.getElementById('searchInput').value);
            let filtered = database;
            if (currentCat !== "Todas") filtered = filtered.filter(i => i.categories.includes(currentCat));
            if (query) filtered = filtered.filter(i => normalize(i.title + i.categories.join(' ') + i.address).includes(query));
            render(filtered.sort((a, b) => (b.premium === true) - (a.premium === true)));
        }
        window.onload = loadData;
    </script>
</body>
</html>
