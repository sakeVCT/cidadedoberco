<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidade do Berço | SELEÇÃO VIMARANENSE</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Plus+Jakarta+Sans:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <style>
        :root { --gold: #b38e5d; --dark: #0f0f0f; }
        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: #fff; color: var(--dark); overflow-x: hidden; }
        
        header { 
            padding: 60px 20px 40px; 
            text-align: center; 
            background: var(--dark); 
            color: white; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-sub-top { 
            font-size: 0.85rem; 
            letter-spacing: 6px; 
            color: var(--gold); 
            margin-bottom: 12px;
            font-weight: 300;
            text-transform: uppercase;
        }

        .logo-main { 
            font-family: 'Cormorant Garamond', serif; 
            font-size: 2.2rem; 
            letter-spacing: 3px; 
            text-transform: uppercase; 
            margin: 0;
            font-weight: 600;
        }

        .container { max-width: 800px; margin: 0 auto 60px; padding: 0 15px; min-height: 300px; }
        .category-wrapper { padding: 35px 0 10px 0; border-bottom: 1px solid #f0f0f0; }

        .election-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .election-header b { 
            color: var(--gold); 
            text-transform: uppercase; 
            font-size: 0.6rem; 
            letter-spacing: 2px; 
        }

        .election-header span { 
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            color: var(--dark);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .card {
            background: var(--dark);
            border-radius: 18px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 12px 30px rgba(0,0,0,0.1);
        }

        .card-img {
            width: 100%;
            height: 320px; 
            object-fit: cover;
            display: block;
            opacity: 0.8;
            cursor: zoom-in;
        }

        .card-content {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 25px;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 45%, transparent);
            color: white;
        }

        .badge {
            background: var(--gold);
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 0.55rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 12px;
            display: inline-block;
            letter-spacing: 1px;
        }

        .title { 
            font-family: 'Cormorant Garamond', serif; 
            font-size: 1.9rem; 
            margin: 0 0 8px 0; 
            text-transform: uppercase; 
            letter-spacing: 2px;
        }
        
        .description { font-size: 0.75rem; color: #ccc; margin-bottom: 18px; text-transform: uppercase; line-height: 1.4; font-weight: 300; }

        .actions { display: flex; gap: 8px; }
        .btn {
            flex: 1; text-align: center;
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.65rem;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-gold { background: var(--gold); color: white; }
        .btn-outline { border: 1px solid rgba(255,255,255,0.3); color: white; }

        .nominees { margin-top: 12px; padding: 0 5px; color: #888; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; }

        #lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.98);
            align-items: center;
            justify-content: center;
        }
        #lightbox.active { display: flex; }
        #lightbox img { max-width: 90%; max-height: 85%; border-radius: 4px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }

        footer { text-align: center; padding: 60px; color: #bbb; font-size: 0.6rem; letter-spacing: 2px; }

        /* Loader */
        .loader { text-align: center; padding: 100px 20px; color: #b38e5d; font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; }

        @media (max-width: 400px) {
            .card-img { height: 280px; }
            .title { font-size: 1.6rem; }
            .election-header span { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo-sub-top">SELEÇÃO VIMARANENSE</div>
    <div class="logo-main">Cidade do Berço</div>
</header>

<div class="container" id="eleitos-container">
    <div class="loader">A carregar seleções...</div>
</div>

<div id="lightbox" onclick="this.classList.remove('active')">
    <img id="lightbox-img" src="">
</div>

<footer>
    © CIDADE DO BERÇO | TODOS OS DIREITOS RESERVADOS
</footer>

<script>
    // CONFIGURAÇÃO
    const user = "sakevct"; 
    const repo = "cidadedoberco";
    const folder = "content/eleitos";

    async function loadContent() {
        const container = document.getElementById('eleitos-container');
        try {
            // Fetch da lista de ficheiros na pasta do GitHub
            const response = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${folder}?t=${new Date().getTime()}`);
            
            if (!response.ok) {
                throw new Error('Repositório não encontrado ou Privado.');
            }

            const files = await response.json();
            container.innerHTML = ''; 

            // Filtra apenas ficheiros .md e ordena
            const mdFiles = files.filter(f => f.name.endsWith('.md')).reverse();

            for (const file of mdFiles) {
                const fileRes = await fetch(file.download_url);
                const text = await fileRes.text();
                
                // Extrair Frontmatter
                const parts = text.split('---');
                if (parts.length < 3) continue;
                
                const content = jsyaml.load(parts[1]);
                
                const cardHtml = `
                    <div class="category-wrapper">
                        <div class="election-header">
                            <b>ELEITO</b> <span>${content.category || 'DESTAQUE'}</span>
                        </div>
                        <div class="card">
                            <img src="${content.image}" class="card-img" onclick="openLightbox(this.src)" onerror="this.src='https://placehold.co/600x400/0f0f0f/b38e5d?text=IMAGEM+INDISPONIVEL'">
                            <div class="card-content">
                                <div class="badge">PREMIUM</div>
                                <h2 class="title">${content.title}</h2>
                                <p class="description">${content.description || ''}</p>
                                <div class="actions">
                                    <a href="tel:${content.phone}" class="btn btn-gold"><i class="fa-solid fa-phone"></i> CONTACTO</a>
                                    <a href="${content.map_link}" target="_blank" class="btn btn-outline"><i class="fa-solid fa-location-dot"></i> MAPA</a>
                                </div>
                            </div>
                        </div>
                        <div class="nominees"><b>NOMEADOS:</b> ${content.nominees || 'EM ATUALIZAÇÃO'}</div>
                    </div>
                `;
                container.innerHTML += cardHtml;
            }

            if (container.innerHTML === '') {
                container.innerHTML = '<div class="loader">Ainda não existem publicações.</div>';
            }

        } catch (error) {
            console.error(error);
            container.innerHTML = `
                <div class="loader" style="color: #ff4444;">
                    ERRO DE LIGAÇÃO<br>
                    <small style="color: #888; font-size: 0.6rem; display: block; margin-top: 10px;">
                        VERIFICA SE O REPOSITÓRIO É PÚBLICO NO GITHUB
                    </small>
                </div>`;
        }
    }

    function openLightbox(src) {
        document.getElementById('lightbox-img').src = src;
        document.getElementById('lightbox').classList.add('active');
    }

    // Inicializa a carga
    loadContent();

    // Netlify Identity
    if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
            if (!user) {
                window.netlifyIdentity.on("login", () => {
                    document.location.href = "/admin/";
                });
            }
        });
    }
</script>

</body>
</html>
