<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidade do Berço | Top Rankings</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #ffffff; --gold: #b38e5d; --dark: #0a0a0a; --elite-bg: #fdfaf3; --border: #eee; }
        
        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: var(--dark); -webkit-font-smoothing: antialiased; }

        header { padding: 35px 15px 20px; text-align: center; border-bottom: 4px double var(--gold); background: var(--dark); color: white; }
        .logo { font-family: 'Cormorant Garamond', serif; font-size: 2rem; text-transform: uppercase; margin: 0; letter-spacing: 2px; }
        .logo span { color: var(--gold); }
        .tagline { font-size: 0.55rem; letter-spacing: 4px; text-transform: uppercase; color: var(--gold); margin-top: 8px; font-weight: 700; }

        .search-area { max-width: 500px; margin: 20px auto; padding: 0 15px; display: flex; box-sizing: border-box; }
        #searchInput { flex: 1; padding: 12px 15px; border: 1px solid var(--gold); font-size: 16px; outline: none; border-radius: 0; appearance: none; }
        .search-btn { background: var(--gold); color: white; border: none; padding: 0 20px; font-size: 11px; text-transform: uppercase; font-weight: 700; cursor: pointer; }

        .container { max-width: 800px; margin: 0 auto 60px; padding: 0 10px; }
        .ranking-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 2px; color: #999; margin: 20px 10px 10px; font-weight: 700; }
        
        #results { display: flex; flex-direction: column; }

        .item { display: flex; align-items: center; text-decoration: none; color: inherit; padding: 12px 10px; border-bottom: 1px solid var(--border); transition: 0.2s; }
        
        /* Estilo Premium */
        .item.premium { background: var(--elite-bg); border-left: 4px solid var(--gold); padding: 18px 10px; margin-bottom: 2px; }
        .item.premium .badge { display: inline-block; background: var(--gold); color: white; font-size: 8px; padding: 2px 7px; border-radius: 2px; margin-bottom: 4px; text-transform: uppercase; font-weight: 700; }

        .img-box { width: 50px; height: 50px; overflow: hidden; background: #eee; border-radius: 50%; margin-right: 15px; flex-shrink: 0; }
        .item.premium .img-box { width: 65px; height: 65px; border: 1px solid var(--gold); border-radius: 4px; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }

        .content-box { flex: 1; }
        .cat { font-size: 0.5rem; letter-spacing: 1px; text-transform: uppercase; color: var(--gold); font-weight: 700; }
        .name { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; margin: 0; font-weight: 700; line-height: 1.1; }
        .item.premium .name { font-size: 1.4rem; color: #000; }
        .loc { font-size: 0.65rem; color: #888; margin-top: 3px; }

        @media (max-width: 600px) {
            .search-area { flex-direction: row; } /* Mantém lado a lado no mobile para ser compacto */
            .search-btn { padding: 0 15px; }
        }

        footer { padding: 40px; text-align: center; font-size: 9px; letter-spacing: 2px; color: #aaa; border-top: 1px solid #eee; background: #fafafa; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Cidade do <span>Berço</span></div>
        <div class="tagline">Official Curator Ranking 2026</div>
    </header>

    <div class="search-area">
        <input type="search" id="searchInput" placeholder="BUSCAR NEGÓCIOS..." autocomplete="off">
        <button type="button" id="searchBtn" class="search-btn">Filtrar</button>
    </div>

    <div class="container">
        <div class="ranking-label">Top Selection</div>
        <div id="results">
            <p style="text-align:center; padding: 40px; opacity:0.5;">A carregar curadoria...</p>
        </div>
    </div>

    <footer>
        &copy; CIDADE DO BERÇO &bull; PREMIUM ACCESS &bull; <a href="/admin/" style="color:inherit; text-decoration:none;">ADMIN</a>
    </footer>

    <script>
        let allData = [];
        const synonyms = {
            "lanchar": ["cafe", "cafetaria", "pastelaria", "padaria", "doce", "lanche"],
            "comer": ["restaurante", "gastronomia", "comida", "almoco", "jantar"],
            "beber": ["bar", "cocktail", "noite", "vinho"],
            "dormir": ["hotel", "alojamento", "pousada"]
        };

        const normalize = (s) => s ? s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase() : "";

        async function load() {
            try {
                const res = await fetch('https://api.github.com/repos/Sakevct/cidadedoberco/contents/content/empresas');
                const files = await res.json();
                const items = [];
                for (let f of files) {
                    if (f.name.endsWith('.md')) {
                        const r = await fetch(f.download_url);
                        const t = await r.text();
                        const get = (re) => { const m = t.match(re); return m ? m[1].replace(/"/g,'').trim() : ""; };
                        
                        items.push({
                            title: get(/title:\s*(.*)/) || "Empresa",
                            category: get(/category:\s*(.*)/) || "Geral",
                            image: get(/image:\s*(.*)/) || "https://images.unsplash.com/photo-1497366216548-37526070297c?w=100",
                            address: get(/address:\s*(.*)/) || "Guimarães",
                            premium: t.includes('premium: true') || t.includes('premium: "true"')
                        });
                    }
                }
                allData = items.sort((a, b) => b.premium - a.premium);
                show(allData);
            } catch (e) { console.log(e); }
        }

        function show(list) {
            const grid = document.getElementById('results');
            if(list.length === 0) {
                grid.innerHTML = "<p style='text-align:center; padding:20px;'>Sem resultados para esta busca.</p>";
                return;
            }
            grid.innerHTML = list.map(item => `
                <div class="item ${item.premium ? 'premium' : ''}">
                    <div class="img-box">
                        <img src="${item.image}" onerror="this.src='https://images.unsplash.com/photo-1497366216548-37526070297c?w=100'">
                    </div>
                    <div class="content-box">
                        ${item.premium ? '<span class="badge">Diamond Selection</span>' : ''}
                        <span class="cat">${item.category}</span>
                        <h2 class="name">${item.title}</h2>
                        <div class="loc">📍 ${item.address}</div>
                    </div>
                </div>
            `).join('');
        }

        function runSearch() {
            const q = normalize(document.getElementById('searchInput').value);
            if(!q) { show(allData); return; }
            
            const filtered = allData.filter(i => {
                const t = normalize(i.title);
                const c = normalize(i.category);
                if(t.includes(q) || c.includes(q)) return true;
                for(let key in synonyms) {
                    if(q.includes(key) && synonyms[key].some(s => c.includes(normalize(s)))) return true;
                }
                return false;
            });
            show(filtered.sort((a, b) => b.premium - a.premium));
        }

        document.getElementById('searchBtn').addEventListener('click', (e) => { e.preventDefault(); runSearch(); });
        document.getElementById('searchInput').addEventListener('keypress', (e) => { if(e.key==='Enter') { e.preventDefault(); runSearch(); } });
        window.onload = load;
    </script>
</body>
</html>
