<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidade do Berço | Guimarães</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #39CCCC; --dark: #0a0a0a; --card: #1a1a1a; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--dark); color: white; }
        
        .hero { padding: 60px 20px; text-align: center; background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1590422329307-8894982a8785?q=80&w=1200') center/cover; }
        h1 { color: var(--primary); font-size: 2.5rem; margin: 0; }

        .search-container { max-width: 600px; margin: 30px auto; display: flex; gap: 10px; padding: 0 20px; }
        #searchInput { flex: 1; padding: 15px; border-radius: 8px; border: none; outline: none; font-size: 16px; }

        /* Grelha de Empresas */
        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        #results { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        
        .business-card { background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid #333; transition: 0.3s; }
        .business-card:hover { transform: translateY(-5px); border-color: var(--primary); }
        .card-img { width: 100%; height: 180px; object-fit: cover; background: #222; }
        .card-content { padding: 20px; }
        .card-tag { font-size: 12px; color: var(--primary); font-weight: bold; text-transform: uppercase; }
        .card-title { font-size: 1.4rem; margin: 10px 0; }
        .card-info { font-size: 0.9rem; color: #aaa; margin-bottom: 5px; }

        footer { text-align: center; padding: 40px; opacity: 0.5; font-size: 0.8rem; }
        .admin-link { color: white; text-decoration: none; }
    </style>
</head>
<body>

    <section class="hero">
        <h1>Cidade do Berço</h1>
        <p>Encontra o que precisas em Guimarães</p>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Procurar empresa ou categoria..." onkeyup="filterBusinesses()">
        </div>
    </section>

    <div class="container">
        <div id="results">
            </div>
    </div>

    <footer>
        <p>&copy; 2026 Cidade do Berço</p>
        <a href="/admin/" class="admin-link">Gestão</a>
    </footer>

    <script>
        let allBusinesses = [];

        // 1. Função para carregar as empresas do GitHub via API
        async function loadBusinesses() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = "<p>A carregar empresas...</p>";

            try {
                // Vamos buscar a lista de ficheiros na pasta content/empresas
                const response = await fetch('https://api.github.com/repos/brunofmelo11/cidadedoberco/contents/content/empresas');
                const files = await response.json();

                for (let file of files) {
                    if (file.name.endsWith('.md')) {
                        const res = await fetch(file.download_url);
                        const text = await res.text();
                        
                        // "Limpeza" básica do formato Markdown/YAML
                        const title = text.match(/title:\s*"(.*)"/) || text.match(/title:\s*(.*)/);
                        const category = text.match(/category:\s*"(.*)"/) || text.match(/category:\s*(.*)/);
                        const address = text.match(/address:\s*"(.*)"/) || text.match(/address:\s*(.*)/);
                        const image = text.match(/image:\s*"(.*)"/) || text.match(/image:\s*(.*)/);

                        const business = {
                            title: title ? title[1].replace(/"/g, '') : "Sem nome",
                            category: category ? category[1].replace(/"/g, '') : "Geral",
                            address: address ? address[1].replace(/"/g, '') : "",
                            image: image ? image[1].replace(/"/g, '') : "https://via.placeholder.com/400x200?text=Cidade+do+Berco"
                        };
                        allBusinesses.push(business);
                    }
                }
                displayBusinesses(allBusinesses);
            } catch (e) {
                resultsDiv.innerHTML = "<p>Insere a tua primeira empresa no painel de admin!</p>";
            }
        }

        function displayBusinesses(list) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = list.map(b => `
                <div class="business-card">
                    <img src="${b.image}" class="card-img" onerror="this.src='https://via.placeholder.com/400x200?text=Imagem+Indisponivel'">
                    <div class="card-content">
                        <span class="card-tag">${b.category}</span>
                        <h3 class="card-title">${b.title}</h3>
                        <p class="card-info">📍 ${b.address}</p>
                    </div>
                </div>
            `).join('');
        }

        function filterBusinesses() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allBusinesses.filter(b => 
                b.title.toLowerCase().includes(term) || 
                b.category.toLowerCase().includes(term)
            );
            displayBusinesses(filtered);
        }

        window.onload = loadBusinesses;
    </script>
</body>
</html>
