<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidade do Berço</title>
    <style>
        body { font-family: sans-serif; background: #eee; margin: 0; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .cat { color: #ce1126; font-weight: bold; font-size: 0.8em; text-transform: uppercase; }
        h1 { text-align: center; color: #333; }
    </style>
</head>
<body>
    <h1>Cidade do Berço</h1>
    <div id="lista" class="grid"></div>

    <script>
        fetch('locais.json')
            .then(res => res.json())
            .then(dados => {
                const lista = document.getElementById('lista');
                dados.forEach(local => {
                    lista.innerHTML += `
                        <div class="card">
                            <span class="cat">${local.categoria}</span>
                            <h3>${local.nome}</h3>
                            <p>${local.descricao}</p>
                            <a href="${local.link}" target="_blank">Ver mais</a>
                        </div>
                    `;
                });
            });
    </script>
</body>
</html>
