<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidade do Berço | Guimarães Premium</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Paleta Chique: Branco, Creme e Dourado */
            --bg: #ffffff;
            --subtle-bg: #fdfbf8; /* Um creme muito suave para profundidade */
            --text-dark: #1a1a1a;
            --text-light: #666666;
            --gold: #c3a365; /* Um dourado sofisticado, não muito amarelo */
            --gold-light: #e0cc9b;
            --card-shadow: 0 15px 35px rgba(195, 163, 101, 0.08); /* Sombra suave dourada */
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-dark);
            line-height: 1.7;
        }

        /* Hero Section Chique em tons claros */
        .hero {
            height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            /* Imagem de Guimarães com overlay claro/creme */
            background: linear-gradient(rgba(253, 251, 248, 0.92), rgba(253, 251, 248, 0.95)),
                        url('https://images.unsplash.com/photo-1590422329307-8894982a8785?q=80&w=2000') center/cover;
            padding: 0 20px;
            border-bottom: 1px solid rgba(195, 163, 101, 0.1);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3.2rem, 9vw, 5.5rem);
            margin: 0;
            letter-spacing: -2px;
            color: var(--text-dark);
            font-weight: 700;
        }

        /* Destaque dourado no título */
        h1 span {
            color: var(--gold);
            position: relative;
        }

        .hero p {
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-top: 15px;
            color: var(--gold);
        }

        /* Busca Minimalista Dourada */
        .search-wrapper {
            margin-top: 60px;
            width: 100%;
            max-width: 650px;
            position: relative;
        }

        #searchInput {
            width: 100%;
            padding: 22px 35px;
            background: white;
            border: 1px solid rgba(195, 163, 101, 0.2);
            border-radius: 100px;
            color: var(--text-dark);
            font-size: 18px;
            outline: none;
            transition: 0.4s;
            box-sizing: border-box;
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
        }

        #searchInput:focus {
            border-color: var(--gold);
            box-shadow: 0 10px 30px rgba(195, 163, 101, 0.15);
        }

        /* Grelha de Conteúdo */
        .container {
            max-width: 1200px;
            margin: -80px auto 100px;
            padding: 0 30px;
        }

        #results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 45px;
        }
