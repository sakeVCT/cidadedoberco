<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidade do Berço | Curadoria Seleta</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --gold: #b38e5d;
            --dark: #121212;
            --light-gold: #f9f6f0;
        }

        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg);
            color: var(--dark);
            -webkit-font-smoothing: antialiased;
        }

        header {
            padding: 60px 20px 40px;
            text-align: center;
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            line-height: 0.9;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .logo span { color: var(--gold); }

        .tagline {
            font-size: 0.7rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold);
        }

        /* Pesquisa Otimizada */
        .search-area {
            max-width: 600px;
            margin: 0 auto 50px;
            padding: 0 20px;
            display: flex;
            gap: 0; /* Colados para parecer uma peça única */
        }

        #searchInput {
            flex: 1;
            padding: 18px 20px;
            border: 1px solid #e5e5e5;
            border-right: none;
            border-radius: 0;
            font-size: 14px;
            outline: none;
            font-family: 'Montserrat', sans-serif;
        }

        .search-btn {
            background: var(--gold);
            color: white;
            border: 1px solid var(--gold);
            padding: 0 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .search-btn:hover {
            background: var(--dark);
            border-color: var(--dark);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto 80px;
            padding: 0 20px;
        }

        #results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 40px 30px;
        }

        @media (max-width: 600px) {
            .search-area {
                flex-direction: column;
                gap: 10px;
            }
            #searchInput {
                border: 1px solid #e5e5e5;
            }
            .search-btn {
                padding: 18px;
            }
            #results {
                grid-template-columns: 1fr;
            }
        }

        .curadoria-item {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .img-container {
            aspect-ratio: 1/1;
            overflow: hidden;
            background: #f7f7f7;
            margin-bottom: 20px;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 1s;
        }

        .category {
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 8px;
            display: block;
        }

        .title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            margin: 0 0 8px 0;
            font-weight: 600;
        }

        .address {
            font-size: 0.8rem;
            color: #888;
        }

        footer {
            padding: 60px 20px;
            background: var(--light-gold);
            text-align: center;
            font-size: 0.65rem;
            letter-spacing: 2px;
        }

        .admin-link { color: var(--gold); text-decoration: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Cidade do <span>Berço</span></div>
        <div class="tagline">Curadoria Seleta • Guimarães</div>
    </header>

    <div class="search-area">
        <input type="text" id="searchInput" placeholder="O QUE DESEJA ENCONTRAR?" onkeydown="if(event.key === 'Enter') runSearch()">
        <button class="search-btn" onclick="runSearch()">Procurar</button>
    </div>

    <div class="container">
        <div id="results">
            <p style="grid-column: 1/-1; text-align:center; opacity:0.5;">A carregar curadoria...</p>
        </div>
    </div>

    <footer>
        &copy; 2026 CIDADE DO BERÇO &bull; GUIMARÃES<br><br>
        <a href="/admin/" class="admin-link">ACESSO PRIVADO</a>
    </footer>

    <script>
        let allItems = [];

        const synonyms = {
            "lanchar": ["cafe", "cafetaria", "pastelaria", "padaria", "doce", "lanche"],
            "comer": ["restaurante", "gastronomia", "comida", "almoco", "jantar"],
            "beber": ["bar", "cocktail", "noite", "vinho"],
            "dormir": ["hotel", "alojamento", "pousada"]
        };

        const normalize = (str) => str ? str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase() : "";

        async function load() {
            try {
                const res = await fetch('https://api.github.com/repos/Sakevct/cidadedoberco/contents/content/empresas');
                const files = await res.json();
                
                const loadedItems = [];
                for (let f of files) {
                    if (f.name.endsWith('.md')) {
                        const r = await fetch(f.download_url);
                        const t = await r.text();
                        
                        const get = (regex) => {
                            const m = t.match(regex);
                            return m ? m[1].replace(/"/g,'').trim() : null;
                        };

                        loadedItems.push({
                            title: get(/title:\s*(.*)/) || "Sem Nome",
                            category: get(/category:\s*(.*)/) || "Geral",
                            image: get(/image:\s*(.*)/) || "https://images.unsplash.com/photo-1497366216548-37526070297c?w=800",
                            address: get(/address:\s*(.*)/) || "Guimarães"
                        });
                    }
                }
                allItems = loadedItems;
                show(allItems);
            } catch (e) { 
                document.getElementById('results').innerHTML = "<p style='grid-column:1/-1; text-align:center;'>Erro ao carregar dados.</p>";
            }
        }

        function show(list) {
            const grid = document.getElementById('results');
            if(list.length === 0) {
                grid.innerHTML = "<p style='grid-column: 1/-1; text-align:center; opacity:0.5;'>Nenhum resultado encontrado para esta pesquisa.</p>";
                return;
            }
            grid.innerHTML = list.map(item => `
                <div class="curadoria-item">
                    <div class="img-container">
                        <img src="${item.image}" onerror="this.src='https://images.unsplash.com/photo-1497366216548-37526070297c?w=800'">
                    </div>
                    <span class="category">${item.category}</span>
                    <h2 class="title">${item.title}</h2>
                    <div class="address">📍 ${item.address}</div>
                </div>
            `).join('');
        }

        // Função unificada para o botão e para o Enter
        function runSearch() {
            const query = normalize(document.getElementById('searchInput').value);
            
            if (!query) {
                show(allItems);
                return;
            }

            const filtered = allItems.filter(item => {
                const title = normalize(item.title);
                const cat = normalize(item.category);
                
                // Busca direta
                if (title.includes(query) || cat.includes(query)) return true;
                
                // Busca por sinónimos
                for (let key in synonyms) {
                    if (query.includes(key)) {
                        return synonyms[key].some(s => cat.includes(normalize(s)));
                    }
                }
                return false;
            });
            show(filtered);
        }

        window.onload = load;
    </script>
</body>
</html>
