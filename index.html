<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidade do Berço | SELEÇÃO VIMARANENSE</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Plus+Jakarta+Sans:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <style>
        :root { --gold: #b38e5d; --dark: #0f0f0f; }
        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: #fff; color: var(--dark); overflow-x: hidden; }
        
        header { 
            padding: 40px 15px 20px; 
            text-align: center; 
            background: var(--dark); 
            color: white; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wall-icon { width: 70px; height: auto; margin-bottom: 20px; opacity: 0.95; }
        .wall-icon path { fill: var(--gold); }
        .logo-main { font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; letter-spacing: 4px; text-transform: uppercase; margin: 0; font-weight: 600; }
        
        /* Link Sobre Nós no Header */
        .header-nav { margin-top: 20px; }
        .header-nav a { color: var(--gold); text-decoration: none; font-size: 0.65rem; letter-spacing: 3px; text-transform: uppercase; font-weight: 600; border: 1px solid var(--gold); padding: 8px 20px; border-radius: 50px; transition: 0.3s; }
        .header-nav a:hover { background: var(--gold); color: white; }

        .container { max-width: 1000px; margin: 0 auto 40px; padding: 0 15px; }
        .category-wrapper { padding: 55px 0 35px 0; border-bottom: 1px solid #f0f0f0; }
        .election-header { display: flex; flex-direction: column; gap: 8px; margin-bottom: 25px; padding: 0 5px; }
        .winner-name { font-family: 'Cormorant Garamond', serif; font-size: 2.4rem; color: var(--dark); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; line-height: 1; margin: 0; }
        .category-info { display: flex; align-items: baseline; gap: 12px; }
        .category-info b { color: var(--gold); text-transform: uppercase; font-size: 0.95rem; letter-spacing: 5px; font-weight: 600; }
        .category-info span { font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: 2px; font-weight: 300; }

        .card { background: var(--dark); border-radius: 20px; overflow: hidden; position: relative; box-shadow: 0 15px 35px rgba(0,0,0,0.1); cursor: pointer; }
        .card-img { width: 100%; height: 420px; object-fit: cover; display: block; }
        .card-actions-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 30px; background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 100%); display: flex; gap: 12px; }

        .description-box { padding: 12px 10px 5px 10px; font-size: 0.7rem; color: #555; line-height: 1.6; font-weight: 400; text-transform: uppercase; letter-spacing: 1px; }
        .btn { flex: 1; text-align: center; padding: 15px; border-radius: 12px; text-decoration: none; font-weight: 600; font-size: 0.7rem; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-gold { background: var(--gold); color: white; }
        .btn-outline { border: 1px solid rgba(255,255,255,0.5); color: white; backdrop-filter: blur(4px); }

        .nominees { margin-top: 15px; padding: 12px 10px; background: #f9f9f9; border-radius: 10px; color: #999; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; }
        .nominees b { color: #777; margin-right: 5px; }

        footer { text-align: center; padding: 60px 20px; background: #fafafa; border-top: 1px solid #eee; }
        .footer-link { color: var(--dark); text-decoration: none; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; font-weight: 600; }
        .footer-copy { color: #bbb; font-size: 0.6rem; margin-top: 20px; letter-spacing: 2px; }

        #lightbox { display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; }
        #lightbox.active { display: flex; }
        #lightbox img { max-width: 95%; max-height: 85%; border-radius: 10px; }

        @media (max-width: 480px) { .winner-name { font-size: 1.8rem; } .card-img { height: 350px; } }
    </style>
</head>
<body>

<header>
    <svg class="wall-icon" viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg"><path d="M10,10 L90,10 L90,20 L10,20 L10,10 Z M15,20 L85,20 L85,60 L15,60 L15,20 Z M20,20 L30,20 L30,10 L20,10 L20,20 Z M35,20 L45,20 L45,10 L35,10 L35,20 Z M50,20 L60,20 L60,10 L50,10 L50,20 Z M65,20 L75,20 L75,10 L65,10 L65,20 Z M80,20 L90,20 L90,10 L80,10 L80,20 Z"/></svg>
    <div class="logo-main">Cidade do Berço</div>
    <nav class="header-nav">
        <a href="sobre.html">Sobre o Projeto</a>
    </nav>
</header>

<div class="container" id="eleitos-container"></div>

<footer>
    <a href="sobre.html" class="footer-link">Conheça a Nossa Essência</a>
    <div class="footer-copy">© CIDADE DO BERÇO | GUIMARÃES</div>
</footer>

<div id="lightbox" onclick="this.classList.remove('active')"><img id="lightbox-img" src=""></div>

<script>
    const user = "sakevct"; 
    const repo = "cidadedoberco";
    const folder = "content/eleitos";

    async function loadContent() {
        const container = document.getElementById('eleitos-container');
        const ts = new Date().getTime(); 
        try {
            const response = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${folder}?v=${ts}`);
            const files = await response.json();
            const mdFiles = files.filter(f => f.name.endsWith('.md'));
            let allPosts = [];

            for (const file of mdFiles) {
                const fileRes = await fetch(`${file.download_url}?v=${ts}`);
                const text = await fileRes.text();
                const parts = text.split('---');
                if (parts.length < 3) continue;
                allPosts.push(jsyaml.load(parts[1]));
            }

            // Ordenação pelo Título (01, 02, 03...)
            allPosts.sort((a, b) => {
                const getNum = (t) => parseInt(t.toString().match(/^\d+/) || 999);
                return getNum(a.title) - getNum(b.title);
            });

            container.innerHTML = ''; 
            allPosts.forEach(content => {
                let cleanTitle = content.title.toString().replace(/^\d+\s*[-_]?\s*/, '');
                container.innerHTML += `
                    <div class="category-wrapper">
                        <div class="election-header">
                            <h2 class="winner-name">${cleanTitle}</h2>
                            <div class="category-info"><b>ELEITO</b> <span>${content.category || ''}</span></div>
                        </div>
                        <div class="card" onclick="openLightbox('${content.image}')">
                            <img src="${content.image}" class="card-img">
                            <div class="card-actions-overlay">
                                <a href="tel:${content.phone}" class="btn btn-gold" onclick="event.stopPropagation()"><i class="fa-solid fa-phone"></i> CONTACTO</a>
                                <a href="${content.map_link}" target="_blank" class="btn btn-outline" onclick="event.stopPropagation()"><i class="fa-solid fa-location-dot"></i> MAPA</a>
                            </div>
                        </div>
                        <div class="description-box">${content.description || ''}</div>
                        <div class="nominees"><b>NOMEADOS:</b> ${content.nominees || ''}</div>
                    </div>
                `;
            });
        } catch (e) { container.innerHTML = '<p style="text-align:center; padding:50px; color:#888;">A carregar a melhor seleção...</p>'; }
    }
    function openLightbox(src) { document.getElementById('lightbox-img').src = src; document.getElementById('lightbox').classList.add('active'); }
    loadContent();
</script>
</body>
</html>
