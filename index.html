<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidade do Berço | Top Elite 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,400&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --gold: #b38e5d; --dark: #0f0f0f; }
        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: #fff; color: var(--dark); overflow-x: hidden; }
        
        header { padding: 80px 20px; text-align: center; background: var(--dark); color: white; }
        .logo { 
            font-family: 'Cormorant Garamond', serif; 
            font-size: 2.5rem; 
            letter-spacing: 4px; 
            text-transform: uppercase; 
            margin: 0;
            font-weight: 500;
        }
        .logo span { color: var(--gold); margin-left: 8px; font-weight: 300; }
        .tagline { font-size: 0.65rem; letter-spacing: 5px; text-transform: uppercase; color: var(--gold); margin-top: 15px; opacity: 0.8; }

        .container { max-width: 800px; margin: 0 auto 100px; padding: 0 20px; }
        
        .category-wrapper { padding: 70px 0 10px 0; }

        .election-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        /* A fonte "ELEITO" (mais forte) */
        .election-header b { 
            color: var(--gold); 
            text-transform: uppercase; 
            font-size: 0.7rem; 
            letter-spacing: 3px; 
            font-weight: 700;
            border: 1px solid rgba(179, 142, 93, 0.3);
            padding: 4px 8px;
            border-radius: 4px;
        }

        /* A fonte "CHIC/FOFA" (O título propriamente dito) */
        .election-header span { 
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            color: var(--dark);
            font-style: italic; /* Dá o toque "fofo" e elegante */
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .card {
            background: var(--dark);
            border-radius: 28px; /* Mais arredondado para ser mais "soft" */
            overflow: hidden;
            position: relative;
            box-shadow: 0 25px 55px rgba(0,0,0,0.08);
        }

        .card-img {
            width: 100%;
            height: 480px;
            object-fit: cover;
            display: block;
            opacity: 0.9;
        }

        .card-content {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 40px;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 20%, transparent);
            color: white;
        }

        .badge {
            background: var(--gold);
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.55rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 12px;
            display: inline-block;
            letter-spacing: 1.5px;
        }

        .title { font-family: 'Cormorant Garamond', serif; font-size: 2.8rem; margin: 0 0 8px 0; font-weight: 500; }
        .description { font-size: 0.85rem; color: #eee; margin-bottom: 25px; font-weight: 300; line-height: 1.5; font-style: italic; opacity: 0.9; }

        .actions { display: flex; gap: 12px; }
        .btn {
            flex: 1; text-align: center;
            padding: 14px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.4s;
        }
        .btn-gold { background: var(--gold); color: white; }
        .btn-outline { border: 1px solid rgba(255,255,255,0.3); color: white; background: rgba(255,255,255,0.1); backdrop-filter: blur(5px); }

        .nominees { margin-top: 25px; padding: 15px; color: #999; font-size: 0.75rem; text-align: center; font-style: italic; }
