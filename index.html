<!DOCTYPE html>
<html lang="pt">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6FVLJHSE9F"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-6FVLJHSE9F');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidade do Berço | O trono só tem um lugar</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Plus+Jakarta+Sans:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <style>
        :root { --gold: #c5a059; --dark: #0a0a0a; --accent: #1a1a1a; }
        * { box-sizing: border-box; scroll-behavior: smooth; }
        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: #fff; color: var(--dark); overflow-x: hidden; }
        
        header { padding: 65px 15px; text-align: center; background: var(--dark); color: white; display: flex; flex-direction: column; align-items: center; }
        .logo-main { font-family: 'Cormorant Garamond', serif; font-size: 2.8rem; letter-spacing: 7px; text-transform: uppercase; margin: 0; font-weight: 600; color: #fff; }
        .slogan { font-size: 0.75rem; letter-spacing: 8px; color: var(--gold); margin-top: 20px; font-weight: 300; text-transform: uppercase; }

        .container { max-width: 1000px; margin: 0 auto 40px; padding: 0 15px; }
        .category-wrapper { padding: 80px 0 40px 0; border-bottom: 1px solid #f0f0f0; }
        
        .winner-name { font-family: 'Cormorant Garamond', serif; font-size: 2.6rem; color: var(--dark); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; line-height: 1.1; margin: 0; }
        .badge-throne { background: var(--dark); color: var(--gold); font-size: 0.65rem; letter-spacing: 3px; padding: 5px 14px; border-radius: 4px; font-weight: 600; text-transform: uppercase; border: 1px solid var(--gold); }
        .cat-label { font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: 2px; font-weight: 300; }

        .card { background: var(--dark); border-radius: 24px; overflow: hidden; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.12); cursor: pointer; }
        .card-img { width: 100%; height: 500px; object-fit: cover; border-radius: 24px; display: block; filter: grayscale(10%); transition: 0.5s; }
        .card:hover .card-img { filter: grayscale(0%); transform: scale(1.01); }

        .card-actions-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 25px; background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%); display: flex; gap: 10px; border-radius: 0 0 24px 24px; }

        .btn { flex: 1; text-align: center; padding: 15px; border-radius: 12px; text-decoration: none; font-weight: 600; font-size: 0.7rem; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.3s; border: none; cursor: pointer; }
        .btn-gold { background: var(--gold); color: #000; }
        .btn-outline { border: 1px solid rgba(255,255,255,0.4); color: white; backdrop-filter: blur(8px); }
        .btn-share { background: rgba(255,255,255,0.1); color: #fff; max-width: 60px; }

        .description-box { padding: 25px 10px; font-size: 0.8rem; color: #444; line-height: 1.8; text-transform: uppercase; letter-spacing: 1.2px; text-align: justify; }
        .nominees { margin-top: 15px; padding: 15px; background: #fafafa; border-radius: 12px; color: #bbb; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.5px; }

        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--gold); color: #000; padding: 12px 25px; border-radius: 50px; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; display: none; z-index: 10000; }

        @media (max-width: 600px) { 
            .logo-main { font-size: 1.8rem; letter-spacing: 4px; }
            .winner-name { font-size: 2.2rem; } 
            .card-img { height: 400px; } 
        }
    </style>
</head>
<body>

<header>
    <div class="logo-main">Cidade do Berço</div>
    <div class="slogan">O trono só tem um lugar</div>
</header>

<div class="container" id="eleitos-container"></div>
<div id="toast">LINK COPIADO PARA O TRONO!</div>

<footer style="text-align: center; padding: 80px 20px;">
    <a href="index.html" style="font-family: 'Cormorant Garamond', serif; color: var(--gold); text-decoration: none; letter-spacing: 3px; text-transform: uppercase; font-size: 1.2rem;">Cidade do Berço</a>
</footer>

<script>
    const user = "sakevct"; 
    const repo = "cidadedoberco";
    const folder = "content/eleitos";

    async function loadContent() {
        const container = document.getElementById('eleitos-container');
        const ts = new Date().getTime(); 
        try {
            const response = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${folder}?v=${ts}`);
            const files = await response.json();
            const mdFiles = files.filter(f => f.name.endsWith('.md'));
            let allPosts = [];

            for (const file of mdFiles) {
                const fileRes = await fetch(`${file.download_url}?v=${ts}`);
                const text = await fileRes.text();
                const parts = text.split('---');
                if (parts.length < 3) continue;
                
                let data = jsyaml.load(parts[1]);
                data.fileName = file.name; 
                allPosts.push(data);
            }

            allPosts.sort((a, b) => {
                const numA = parseInt(a.title.toString().match(/^\d+/) || a.fileName.match(/^\d+/) || 999);
                const numB = parseInt(b.title.toString().match(/^\d+/) || b.fileName.match(/^\d+/) || 999);
                return numA - numB;
            });

            container.innerHTML = ''; 
            allPosts.forEach(content => {
                let cleanTitle = content.title.toString().replace(/^\d+\s*[-_]?\s*/, '');
                let anchorId = cleanTitle.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '-');
                let category = content.category || 'Elite';

                // Lógica de Botão Robusta
                let actionLink = content.order_link || content.map_link;
                let actionText = content.order_link ? "ENCOMENDAR" : "LOCALIZAÇÃO";

                container.innerHTML += `
                    <div class="category-wrapper" id="${anchorId}">
                        <div style="margin-bottom: 25px;">
                            <h2 class="winner-name">${cleanTitle}</h2>
                            <div style="display: flex; align-items: center; gap: 12px; margin-top: 10px;">
                                <span class="badge-throne">NO TRONO</span>
                                <span class="cat-label">${category}</span>
                            </div>
                        </div>
                        <div class="card">
                            <img src="${content.image}" class="card-img">
                            <div class="card-actions-overlay">
                                <a href="tel:${content.phone}" class="btn btn-gold" onclick="event.stopPropagation()"><i class="fa-solid fa-phone"></i></a>
                                <a href="${actionLink}" target="_blank" rel="noopener noreferrer" class="btn btn-outline" onclick="event.stopPropagation()">${actionText}</a>
                                <button class="btn btn-share" onclick="shareTrono(event, '${anchorId}', '${category}')">
                                    <i class="fa-solid fa-share-nodes"></i>
                                </button>
                            </div>
                        </div>
                        <div class="description-box">${content.description || ''}</div>
                        <div class="nominees"><b>CANDIDATOS:</b> ${content.nominees || ''}</div>
                    </div>
                `;
            });

            if(window.location.hash) {
                setTimeout(() => {
                    const el = document.querySelector(window.location.hash);
                    if(el) el.scrollIntoView();
                }, 600);
            }

        } catch (e) { console.error(e); }
    }

    function shareTrono(event, id, categoryName) {
        event.stopPropagation();
        const url = `${window.location.origin}${window.location.pathname}#${id}`;
        const shareText = `VÊ QUEM ESTÁ NO TRONO DE "${categoryName.toUpperCase()}" DA CIDADE DO BERÇO:`;

        if (navigator.share) {
            navigator.share({ title: 'CIDADE DO BERÇO', text: shareText, url: url }).catch(() => { copyToClipboard(url); });
        } else {
            copyToClipboard(url);
        }
    }

    function copyToClipboard(url) {
        navigator.clipboard.writeText(url);
        const toast = document.getElementById('toast');
        toast.innerText = "LINK COPIADO PARA O TRONO!";
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2500);
    }

    loadContent();
</script>

<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", user => {
      if (!user) {
        window.netlifyIdentity.on("login", () => {
          document.location.href = "/admin/";
        });
      }
    });
  }
</script>
</body>
</html>
