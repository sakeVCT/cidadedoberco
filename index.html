<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidade do Berço | Top Elite 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #b38e5d; --dark: #0f0f0f; }
        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: #fff; color: var(--dark); }
        
        /* Cabeçalho */
        header { padding: 60px 20px; text-align: center; background: var(--dark); color: white; }
        .logo-main { font-family: 'Cormorant Garamond', serif; font-size: 2.4rem; letter-spacing: 5px; text-transform: uppercase; margin: 0; }
        .logo-sub { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1rem; letter-spacing: 10px; color: var(--gold); text-transform: uppercase; }

        .container { max-width: 800px; margin: 0 auto 100px; padding: 0 20px; }
        .category-wrapper { padding: 50px 0 10px 0; }

        /* Estrutura do Cartão */
        .card { 
            background: var(--dark); 
            border-radius: 20px; 
            overflow: hidden; 
            position: relative; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
        }

        /* Contentor da Imagem */
        .card-img-container { 
            position: relative; 
            width: 100%; 
            height: 420px; 
        }

        /* O SELO DOURADO AUTOMÁTICO */
        /* Este código faz com que o selo apareça em TODAS as fotos que usarem este container */
        .card-img-container::after {
            content: "";
            position: absolute;
            top: 20px;
            right: 20px;
            width: 110px; /* Ajusta o tamanho conforme preferires */
            height: 110px;
            /* Substitui pelo link da imagem do selo sem fundo que guardaste */
            background-image: url('teu-selo-dourado-sem-fundo.png'); 
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 10;
            pointer-events: none; /* Garante que o selo não interfere nos cliques */
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5)); /* Dá destaque extra sobre a foto */
        }

        .card-img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0.9; }

        .card-content { 
            position: absolute; 
            bottom: 0; left: 0; right: 0; 
            padding: 30px; 
            background: linear-gradient(to top, rgba(0,0,0,0.95) 40%, transparent); 
            color: white; 
        }

        .title { font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; margin: 0; }
        .badge { background: var(--gold); padding: 4px 12px; border-radius: 50px; font-size: 0.6rem; font-weight: 700; text-transform: uppercase; margin-bottom: 10px; display: inline-block; }
        
        .actions { display: flex; gap: 10px; margin-top: 15px; }
        .btn { flex: 1; text-align: center; padding: 12px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 0.7rem; text-transform: uppercase; }
        .btn-gold { background: var(--gold); color: white; }
    </style>
</head>
<body>

<header>
    <div class="logo-main">Cidade do Berço</div>
    <div class="logo-sub">Top 2026</div>
</header>

<div class="container">
    <div class="category-wrapper">
        <div class="card">
            <div class="card-img-container">
                <img src="img1.jpg" alt="Café Areal" class="card-img">
            </div>
            <div class="card-content">
                <div class="badge">Elite Selection</div>
                <h2 class="title">Café Areal</h2>
                <div class="actions">
                    <a href="#" class="btn btn-gold">Reservar</a>
                </div>
            </div>
        </div>
    </div>

    <div class="category-wrapper">
        <div class="card">
            <div class="card-img-container">
                <img src="img2.jpg" alt="Outro Vencedor" class="card-img">
            </div>
            <div class="card-content">
                <div class="badge">Elite Selection</div>
                <h2 class="title">Pastelaria Fina</h2>
                <div class="actions">
                    <a href="#" class="btn btn-gold">Ver Mais</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
