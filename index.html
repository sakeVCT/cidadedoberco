<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidade do Berço | Top 2026</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --bg: #ffffff; --gold: #b38e5d; --dark: #000000; --elite: #fdfaf3; --border: #eee; }
        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--dark); overflow-x: hidden; }
        header { padding: 30px 20px; text-align: center; background: var(--dark); color: #fff; border-bottom: 5px solid var(--gold); }
        .logo { font-family: 'Cormorant Garamond', serif; font-size: 2rem; text-transform: uppercase; letter-spacing: 3px; margin: 0; }
        .logo span { color: var(--gold); }
        .tagline { font-size: 0.6rem; letter-spacing: 5px; text-transform: uppercase; color: var(--gold); margin-top: 8px; font-weight: 700; }
        
        .search-container { max-width: 600px; margin: -25px auto 30px; padding: 0 20px; }
        .search-wrapper { display: flex; background: white; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 1px solid var(--gold); }
        #searchInput { flex: 1; border: none; padding: 15px; font-size: 15px; outline: none; width: 100%; }
        
        .filters { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
        .filter-btn { padding: 6px 14px; background: #f4f4f4; border: 1px solid #ddd; border-radius: 20px; font-size: 10px; text-transform: uppercase; font-weight: 700; cursor: pointer; white-space: nowrap; }
        .filter-btn.active { background: var(--gold); color: white; border-color: var(--gold); }

        .container { max-width: 750px; margin: 0 auto 60px; padding: 0 15px; }
        
        /* RETÂNGULO MAIS PEQUENO AQUI */
        .item { display: flex; align-items: center; padding: 12px 15px; border-bottom: 1px solid var(--border); position: relative; overflow: hidden; background: white; gap: 12px; }
        .item.premium { background: var(--elite); border-left: 4px solid var(--gold); padding: 15px 15px; }
        
        .item.premium::after { content: ""; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent); transform: skewX(-25deg); animation: shine 4s infinite; }
        @keyframes shine { 0% { left: -100%; } 20% { left: 150%; } 100% { left: 150%; } }

        /* IMAGENS MAIS PEQUENAS */
        .img-box { width: 55px; height: 55px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: #eee; }
        .item.premium .img-box { width: 70px; height: 70px; border-radius: 10px; border: 1.5px solid var(--gold); }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .info { flex: 1; min-width: 0; }
        .status { font-size: 8px; text-transform: uppercase; color: var(--gold); font-weight: 800; margin-bottom: 2px; display: flex; align-items: center; gap: 4px; }
        .item-title { font-family: 'Cormorant Garamond', serif; font-size: 1.15rem; margin: 0; font-weight: 700; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item.premium .item-title { font-size: 1.35rem; white-space: normal; }
        
        .item-details { font-size: 0.7rem; color: #777; margin-top: 4px; display: flex; flex-direction: column; gap: 2px; }
        .item-details span { display: flex; align-items: center; gap: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .item-details i { color: var(--gold); width: 10px; text-align: center; font-size: 0.65rem; }
        .item-cat { font-size: 0.6rem; color: var(--gold); text-transform: uppercase; font-weight: 700; letter-spacing: 1px; margin-bottom: 2px; }

        .contact-area { display: flex; gap: 6px; flex-shrink: 0; }
        .contact-btn { background: #25d366; color: white; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 16px; box-shadow: 0 3px 8px rgba(0,0,0,0.1); }
        .contact-btn.call { background: var(--gold); }

        footer { padding: 40px 20px; text-align: center; background: #f9f9f9; border-top: 1px solid #eee; font-size: 9px; letter-spacing: 2px; color: #aaa; }
    </style>
</head>
<body>
    <header><div class="logo">Cidade do <span>Berço</span></div><div class="tagline">O Ranking Exclusivo</div></header>
    <div class="search-container">
        <form class="search-wrapper" onsubmit="event.preventDefault();"><input type="search" id="searchInput" placeholder="Pesquisar..." oninput="executeSearch()"></form>
        <div class="filters" id="categoryFilters"></div>
    </div>
    <div class="container"><div id="results"></div></div>
    <footer>&copy; 2026 CIDADE DO BERÇO &bull; <a href="/admin/" style="color:inherit">ADMIN</a></footer>

    <script>
        let database = [];
        let currentCat = "Todas";
        const normalize = (s) => s ? s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase() : "";

        async function loadData() {
            try {
                const res = await fetch('https://api.github.com/repos/Sakevct/cidadedoberco/contents/content/empresas');
                const files = await res.json();
                const items = [];
                const categories = new Set();
                for (let f of files) {
                    if (f.name.endsWith('.md')) {
                        const r = await fetch(f.download_url);
                        const t = await r.text();
                        const get = (re) => { const m = t.match(re); return m ? m[1].replace(/["']/g, '').trim() : ""; };
                        const cat = get(/category:\s*(.*)/) || "Geral";
                        categories.add(cat);
                        items.push({
                            title: get(/title:\s*(.*)/) || "Empresa",
                            category: cat,
                            image: get(/image:\s*(.*)/) || "https://images.unsplash.com/photo-1497366216548-37526070297c?w=150",
                            whatsapp: get(/whatsapp:\s*(.*)/),
                            address: get(/address:\s*(.*)/),
                            email_cliente: get(/email_cliente:\s*(.*)/),
                            premium: t.includes('premium: true') || t.includes('premium: "true"')
                        });
                    }
                }
                database = items;
                renderFilters(Array.from(categories));
                executeSearch();
            } catch (e) { console.error(e); }
        }

        function renderFilters(cats) {
            const f = document.getElementById('categoryFilters');
            f.innerHTML = `<button class="filter-btn active" onclick="filterByCat('Todas')">Todas</button>` + 
                cats.sort().map(c => `<button class="filter-btn" onclick="filterByCat('${c}')">${c}</button>`).join('');
        }

        function filterByCat(cat) {
            currentCat = cat;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.innerText === cat));
            executeSearch();
        }

        function render(list) {
            const container = document.getElementById('results');
            if(list.length === 0) { container.innerHTML = "<p style='text-align:center; padding:50px;'>Sem resultados.</p>"; return; }
            
            container.innerHTML = list.map(item => `
                <div class="item ${item.premium ? 'premium' : ''}">
                    <div class="img-box"><img src="${item.image}"></div>
                    <div class="info">
                        ${item.premium ? `<span class="status"><i class="fa-solid fa-star"></i> Seleção Premium</span>` : ''}
                        <div class="item-cat">${item.category}</div>
                        <h2 class="item-title">${item.title}</h2>
                        
                        <div class="item-details">
                            ${item.address ? `<span><i class="fa-solid fa-location-dot"></i> ${item.address}</span>` : ''}
                            ${item.email_cliente ? `<span><i class="fa-solid fa-envelope"></i> ${item.email_cliente}</span>` : ''}
                        </div>
                    </div>
                    ${item.whatsapp ? `<div class="contact-area">
                        <a href="https://wa.me/351${item.whatsapp}" class="contact-btn" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>
                        <a href="tel:+351${item.whatsapp}" class="contact-btn call"><i class="fa-solid fa-phone"></i></a>
                    </div>` : ''}
                </div>
            `).join('');
        }

        function executeSearch() {
            const query = normalize(document.getElementById('searchInput').value);
            let filtered = database;
            if (currentCat !== "Todas") filtered = filtered.filter(i => i.category === currentCat);
            if (query) filtered = filtered.filter(i => normalize(i.title + i.category + i.address).includes(query));
            render(filtered.sort((a, b) => b.premium - a.premium));
        }
        window.onload = loadData;
    </script>
</body>
</html>
