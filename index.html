<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidade do Berço | Guimarães Premium</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070a;
            --card-bg: rgba(255, 255, 255, 0.03);
            --accent: #39CCCC; /* Podes mudar para #D4AF37 se quiseres dourado */
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: white;
            line-height: 1.6;
        }

        /* Hero Section Premium */
        .hero {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: radial-gradient(circle at center, rgba(57, 204, 204, 0.15) 0%, transparent 70%),
                        url('https://images.unsplash.com/photo-1590422329307-8894982a8785?q=80&w=2000') center/cover;
            padding: 0 20px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3rem, 8vw, 5rem);
            margin: 0;
            letter-spacing: -2px;
            background: linear-gradient(to bottom, #fff 40%, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 10px;
            color: var(--accent);
        }

        /* Busca Minimalista */
        .search-wrapper {
            margin-top: 50px;
            width: 100%;
            max-width: 600px;
            position: relative;
        }

        #searchInput {
            width: 100%;
            padding: 20px 30px;
            background: var(--glass);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 100px;
            color: white;
            font-size: 18px;
            backdrop-filter: blur(10px);
            outline: none;
            transition: 0.4s;
            box-sizing: border-box;
        }

        #searchInput:focus {
            border-color: var(--accent);
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 30px rgba(57, 204, 204, 0.2);
        }

        /* Grelha de Conteúdo */
        .container {
            max-width: 1200px;
            margin: -100px auto 100px;
            padding: 0 30px;
        }

        #results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 40px;
        }

        /* Cartões Estilo Galeria */
        .business-card {
            background: var(--card-bg);
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .business-card:hover {
            transform: translateY(-15px);
            background: rgba(255,255,255,0.07);
            border-color: rgba(255,255,255,0.2);
        }

        .card-img-wrapper {
            position: relative;
            height: 240px;
            overflow: hidden;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.8s;
        }

        .business-card:hover .card-img {
            scale: 1.1;
        }

        .card-content {
            padding: 30px;
        }

        .card-tag {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 12px;
            display: block;
            font-weight: 600;
        }

        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            margin: 0 0 10px 0;
            color: #fff;
        }

        .card-info {
            font-size: 0.9rem;
            color: #777;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        footer {
            padding: 60px;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            background: #030406;
        }

        .admin-link {
            text-decoration: none;
            color: #444;
            font-size: 12px;
            transition: 0.3s;
        }

        .admin-link:hover { color: var(--accent); }

        /* Loader */
        .loading { text-align: center; padding: 100px; font-size: 1.2rem; letter-spacing: 2px; color: #444; }
    </style>
</head>
<body>

    <section class="hero">
        <h1>Cidade do Berço</h1>
        <p>A Curadoria do que é nosso</p>
        
        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="O que deseja descobrir?" onkeyup="filterBusinesses()">
        </div>
    </section>

    <div class="container">
        <div id="results">
            <div class="loading">Iniciando experiência...</div>
        </div>
    </div>

    <footer>
        <p style="opacity: 0.3; margin-bottom: 20px;">&copy; 2026 Guimarães, Portugal</p>
        <a href="/admin/" class="admin-link">ACCESSO PRIVADO</a>
    </footer>

    <script>
        let allBusinesses = [];

        async function loadBusinesses() {
            const resultsDiv = document.getElementById('results');

            try {
                const response = await fetch('https://api.github.com/repos/Sakevct/cidadedoberco/contents/content/empresas');
                const files = await response.json();

                if (!Array.isArray(files)) throw new Error();

                const entries = [];
                for (let file of files) {
                    if (file.name.endsWith('.md')) {
                        const res = await fetch(file.download_url);
                        const text = await res.text();
                        
                        const titleMatch = text.match(/title:\s*"(.*)"/) || text.match(/title:\s*(.*)/);
                        const catMatch = text.match(/category:\s*"(.*)"/) || text.match(/category:\s*(.*)/);
                        const addrMatch = text.match(/address:\s*"(.*)"/) || text.match(/address:\s*(.*)/);
                        const imgMatch = text.match(/image:\s*"(.*)"/) || text.match(/image:\s*(.*)/);

                        entries.push({
                            title: titleMatch ? titleMatch[1].replace(/"/g, '') : "Curadoria Especial",
                            category: catMatch ? catMatch[1].replace(/"/g, '') : "Exclusivo",
                            address: addrMatch ? addrMatch[1].replace(/"/g, '') : "Guimarães",
                            image: imgMatch ? imgMatch[1].replace(/"/g, '') : "https://images.unsplash.com/photo-1497366216548-37526070297c?q=80&w=800"
                        });
                    }
                }
                allBusinesses = entries;
                displayBusinesses(allBusinesses);
            } catch (e) {
                resultsDiv.innerHTML = "<div class='loading'>Prepare o seu diretório no painel de gestão.</div>";
            }
        }

        function displayBusinesses(list) {
            const resultsDiv = document.getElementById('results');
            if (list.length === 0) {
                resultsDiv.innerHTML = "<div class='loading'>Nenhum resultado encontrado.</div>";
                return;
            }
            resultsDiv.innerHTML = list.map(b => `
                <div class="business-card">
                    <div class="card-img-wrapper">
                        <img src="${b.image}" class="card-img" onerror="this.src='https://images.unsplash.com/photo-1497366216548-37526070297c?q=80&w=800'">
                    </div>
                    <div class="card-content">
                        <span class="card-tag">${b.category}</span>
                        <h3 class="card-title">${b.title}</h3>
                        <div class="card-info">
                            <span>📍</span> ${b.address}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterBusinesses() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allBusinesses.filter(b => 
                b.title.toLowerCase().includes(term) || 
                b.category.toLowerCase().includes(term)
            );
            displayBusinesses(filtered);
        }

        window.onload = loadBusinesses;
    </script>
</body>
</html>
