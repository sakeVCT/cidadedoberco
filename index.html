<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidade do Berço | Top Elite 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --gold: #b38e5d; --dark: #0f0f0f; }
        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: #fff; color: var(--dark); overflow-x: hidden; }
        
        header { 
            padding: 70px 20px 50px; 
            text-align: center; 
            background: var(--dark); 
            color: white; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .wall-icon {
            width: 80px; 
            height: auto;
            margin-bottom: 25px; 
            opacity: 0.95;
        }
        .wall-icon path { fill: var(--gold); }

        .logo-main { 
            font-family: 'Cormorant Garamond', serif; 
            font-size: 2.6rem; 
            letter-spacing: 4px; 
            text-transform: uppercase; 
            margin: 0;
            font-weight: 600;
            white-space: nowrap; 
            line-height: 1.1;
        }
        
        .logo-sub { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1rem; 
            letter-spacing: 10px; 
            color: var(--gold); 
            margin-top: 12px;
            font-weight: 300;
            text-transform: uppercase;
        }

        .container { max-width: 800px; margin: 0 auto 100px; padding: 0 20px; }
        .category-wrapper { padding: 50px 0 10px 0; }

        .election-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .election-header b { 
            color: var(--gold); 
            text-transform: uppercase; 
            font-size: 0.7rem; 
            letter-spacing: 2px; 
            font-weight: 600;
        }

        .election-header span { 
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            color: var(--dark);
            font-style: italic;
            font-weight: 400;
        }

        .card {
            background: var(--dark);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .card-img {
            width: 100%;
            height: 420px;
            object-fit: cover;
            display: block;
            opacity: 0.85;
        }

        .card-content {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 30px;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 30%, transparent);
            color: white;
        }

        .badge {
            background: var(--gold);
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 15px;
            display: inline-block;
        }

        .title { font-family: 'Cormorant Garamond', serif; font-size: 2.4rem; margin: 0 0 10px 0; }
        .description { font-size: 0.85rem; color: #ccc; margin-bottom: 20px; font-weight: 300; line-height: 1.5; }

        .actions { display: flex; gap: 10px; }
        .btn {
            flex: 1; text-align: center;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.7rem;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .btn-gold { background: var(--gold); color: white; }
        .btn-outline { border: 1px solid rgba(255,255,255,0.3); color: white; }

        .nominees { margin-top: 15px; padding: 0 10px; color: #888; font-size: 0.75rem; }
        footer { text-align: center; padding: 60px; color: #bbb; font-size: 0.65rem; }

        @media (max-width: 600px) {
            header { padding: 50px 20px 40px; }
            .wall-icon { width: 60px; margin-bottom: 20px; }
            .logo-main { font-size: 1.8rem; letter-spacing: 2px; }
            .logo-sub { font-size: 0.8rem; letter-spacing: 6px; }
            .title { font-size: 2rem; }
            .election-header span { font-size: 1.5rem; }
        }
        @media (max-width: 420px) {
            .logo-main { font-size: 1.6rem; letter-spacing: 1px; }
        }
    </style>
</head>
