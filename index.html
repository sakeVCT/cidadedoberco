<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidade do Berço | Top 2026</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --bg: #f8f9fa; --gold: #b38e5d; --dark: #121212; --white: #ffffff; }
        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--dark); }
        
        /* Header com mais corpo */
        header { padding: 60px 20px; text-align: center; background: var(--white); border-bottom: 1px solid #eee; }
        .logo { font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; text-transform: uppercase; letter-spacing: 4px; margin: 0; font-weight: 700; }
        .logo span { color: var(--gold); }
        .tagline { font-size: 0.7rem; letter-spacing: 5px; text-transform: uppercase; color: #888; margin-top: 10px; font-weight: 500; }

        /* Barra de Pesquisa "Floating" */
        .search-section { max-width: 650px; margin: -30px auto 40px; padding: 0 20px; }
        .search-wrapper { background: var(--white); display: flex; align-items: center; padding: 5px 15px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border: 1px solid #eee; }
        #searchInput { flex: 1; border: none; padding: 15px; font-size: 16px; outline: none; font-family: 'Plus Jakarta Sans'; }
        
        /* Filtros com Capsulas */
        .filters { display: flex; gap: 10px; overflow-x: auto; padding: 20px 0; scrollbar-width: none; justify-content: center; }
        .filter-btn { padding: 10px 20px; background: var(--white); border: 1px solid #eee; border-radius: 30px; font-size: 11px; text-transform: uppercase; font-weight: 700; cursor: pointer; transition: 0.3s; white-space: nowrap; color: #666; }
        .filter-btn.active { background: var(--dark); color: var(--white); border-color: var(--dark); }

        /* Cards com Design Moderno */
        .container { max-width: 800px; margin: 0 auto 100px; padding: 0 20px; }
        #results { display: flex; flex-direction: column; gap: 20px; }
        
        .item { background: var(--white); border-radius: 16px; display: flex; align-items: center; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid #f0f0f0; transition: 0.3s; }
        .item:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.07); }
        
        /* Destaque Premium */
        .item.premium { border: 1px solid rgba(179, 142, 93, 0.3); background: linear-gradient(to right, #ffffff, #fffcf5); }
        .status-badge { background: #fff9eb; color: var(--gold); font-size: 10px; font-weight: 800; padding: 4px 10px; border-radius: 5px; text-transform: uppercase; display: inline-block; margin-bottom: 8px; letter-spacing: 1px; }

        .img-box { width: 80px; height: 80px; border-radius: 12px; overflow: hidden; margin-right: 20px; flex-shrink: 0; background: #f8f8f8; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .info { flex: 1; }
        .item-title { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; margin: 0; font-weight: 700; color: #111; }
        .item-cat { font-size: 0.75rem; color: #aaa; text-transform: uppercase; margin-top: 4px; font-weight: 500; }
        
        /* Contactos com Cores Vivas */
        .contact-area { display: flex; gap: 10px; }
        .contact-btn { width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 18px; transition: 0.3s; }
        .btn-wa { background: #e7f9ee; color: #25d366; }
        .btn-wa:hover { background: #25d366; color: white; }
        .btn-tel { background: #fdf6ec; color: var(--gold); }
        .btn-tel:hover { background: var(--gold); color: white; }

        footer { padding: 60px 20px; text-align: center; font-size: 10px; letter-spacing: 2px; color: #bbb; text-transform: uppercase; }
    </style>
</head>
<body>
    <header>
        <div class="logo">Cidade do <span>Berço</span></div>
        <div class="tagline">O Ranking Exclusivo</div>
    </header>

    <div class="search-section">
        <div class="search-wrapper">
            <i class="fa-solid fa-magnifying-glass" style="color: var(--gold);"></i>
            <input type="search" id="searchInput" placeholder="O que procura hoje?" oninput="executeSearch()">
        </div>
        <div class="filters" id="categoryFilters"></div>
    </div>

    <div class="container">
        <div id="results"></div>
    </div>

    <footer>&copy; 2026 Cidade do Berço &bull; <a href="/admin/" style="color:inherit">Admin</a></footer>

    <script>
        let database = [];
        let currentCat = "Todas";
        const normalize = (s) => s ? s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase() : "";

        async function loadData() {
            try {
                const res = await fetch('https://api.github.com/repos/Sakevct/cidadedoberco/contents/content/empresas');
                const files = await res.json();
                const items = [];
                const categories = new Set();
                for (let f of files) {
                    if (f.name.endsWith('.md')) {
                        const r = await fetch(f.download_url);
                        const t = await r.text();
                        const get = (re) => { const m = t.match(re); return m ? m[1].replace(/["']/g, '').trim() : ""; };
                        const cat = get(/category:\s*(.*)/) || "Geral";
                        categories.add(cat);
                        items.push({
                            title: get(/title:\s*(.*)/) || "Empresa",
                            category: cat,
                            image: get(/image:\s*(.*)/) || "https://images.unsplash.com/photo-1497366216548-37526070297c?w=150",
                            whatsapp: get(/whatsapp:\s*(.*)/),
                            premium: t.includes('premium: true') || t.includes('premium: "true"')
                        });
                    }
                }
                database = items;
                renderFilters(Array.from(categories));
                executeSearch();
            } catch (e) { console.error(e); }
        }

        function renderFilters(cats) {
            const f = document.getElementById('categoryFilters');
            f.innerHTML = `<button class="filter-btn active" onclick="filterByCat('Todas')">Todas</button>` + 
                cats.sort().map(c => `<button class="filter-btn" onclick="filterByCat('${c}')">${c}</button>`).join('');
        }

        function filterByCat(cat) {
            currentCat = cat;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.innerText === cat));
            executeSearch();
        }

        function render(list) {
            const container = document.getElementById('results');
            if(list.length === 0) { container.innerHTML = "<p style='text-align:center; padding:50px; color:#999;'>Sem resultados.</p>"; return; }
            container.innerHTML = list.map(item => `
                <div class="item ${item.premium ? 'premium' : ''}">
                    <div class="img-box"><img src="${item.image}"></div>
                    <div class="info">
                        ${item.premium ? `<span class="status-badge"><i class="fa-solid fa-crown"></i> Seleção Premium</span>` : ''}
                        <h2 class="item-title">${item.title}</h2>
                        <div class="item-cat">${item.category}</div>
                    </div>
                    ${item.whatsapp ? `
                        <div class="contact-area">
                            <a href="https://wa.me/351${item.whatsapp}" class="contact-btn btn-wa" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>
                            <a href="tel:+351${item.whatsapp}" class="contact-btn btn-tel"><i class="fa-solid fa-phone"></i></a>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function executeSearch() {
            const query = normalize(document.getElementById('searchInput').value);
            let filtered = database;
            if (currentCat !== "Todas") filtered = filtered.filter(i => i.category === currentCat);
            if (query) filtered = filtered.filter(i => normalize(i.title + i.category).includes(query));
            render(filtered.sort((a, b) => b.premium - a.premium));
        }
        window.onload = loadData;
    </script>
</body>
</html>
