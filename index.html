<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidade do Berço | Guimarães Premium</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Paleta Chique: Branco, Creme e Dourado */
            --bg: #ffffff;
            --subtle-bg: #fdfbf8; /* Um creme muito suave para profundidade */
            --text-dark: #1a1a1a;
            --text-light: #666666;
            --gold: #c3a365; /* Um dourado sofisticado, não muito amarelo */
            --gold-light: #e0cc9b;
            --card-shadow: 0 15px 35px rgba(195, 163, 101, 0.08); /* Sombra suave dourada */
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-dark);
            line-height: 1.7;
        }

        /* Hero Section Chique em tons claros */
        .hero {
            height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            /* Imagem de Guimarães com overlay claro/creme */
            background: linear-gradient(rgba(253, 251, 248, 0.92), rgba(253, 251, 248, 0.95)),
                        url('https://images.unsplash.com/photo-1590422329307-8894982a8785?q=80&w=2000') center/cover;
            padding: 0 20px;
            border-bottom: 1px solid rgba(195, 163, 101, 0.1);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3.2rem, 9vw, 5.5rem);
            margin: 0;
            letter-spacing: -2px;
            color: var(--text-dark);
            font-weight: 700;
        }

        /* Destaque dourado no título */
        h1 span {
            color: var(--gold);
            position: relative;
        }

        .hero p {
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-top: 15px;
            color: var(--gold);
        }

        /* Busca Minimalista Dourada */
        .search-wrapper {
            margin-top: 60px;
            width: 100%;
            max-width: 650px;
            position: relative;
        }

        #searchInput {
            width: 100%;
            padding: 22px 35px;
            background: white;
            border: 1px solid rgba(195, 163, 101, 0.2);
            border-radius: 100px;
            color: var(--text-dark);
            font-size: 18px;
            outline: none;
            transition: 0.4s;
            box-sizing: border-box;
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
        }

        #searchInput:focus {
            border-color: var(--gold);
            box-shadow: 0 10px 30px rgba(195, 163, 101, 0.15);
        }

        /* Grelha de Conteúdo */
        .container {
            max-width: 1200px;
            margin: -80px auto 100px;
            padding: 0 30px;
        }

        #results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 45px;
        }

        /* Cartões Brancos Chique */
        .business-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(195, 163, 101, 0.05);
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: var(--card-shadow);
        }

        .business-card:hover {
            transform: translateY(-12px);
            border-color: rgba(195, 163, 101, 0.3);
            box-shadow: 0 25px 50px rgba(195, 163, 101, 0.15);
        }

        .card-img-wrapper {
            position: relative;
            height: 250px;
            overflow: hidden;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.9s;
        }

        .business-card:hover .card-img {
            scale: 1.08;
        }

        /* Overlay dourado subtil na imagem ao passar o rato */
        .card-img-wrapper::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent 50%, rgba(195, 163, 101, 0.15));
            opacity: 0;
            transition: 0.5s;
        }

        .business-card:hover .card-img-wrapper::after {
            opacity: 1;
        }

        .card-content {
            padding: 30px;
            background-color: white;
        }

        .card-tag {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 12px;
            display: inline-block;
            font-weight: 600;
            border-bottom: 1px solid rgba(195, 163, 101, 0.2);
            padding-bottom: 3px;
        }

        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.7rem;
            margin: 0 0 12px 0;
            color: var(--text-dark);
            font-weight: 600;
        }

        .card-info {
            font-size: 0.95rem;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-icon {
            color: var(--gold);
            opacity: 0.7;
        }

        /* Footer Elegante */
        footer {
            padding: 80px 60px;
            text-align: center;
            border-top: 1px solid rgba(195, 163, 101, 0.1);
            background: var(--subtle-bg);
        }

        footer p {
            color: var(--text-light);
            font-size: 0.9rem;
            opacity: 0.7;
            margin-bottom: 25px;
        }

        .admin-link {
            text-decoration: none;
            color: var(--gold);
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 1px solid rgba(195, 163, 101, 0.3);
            padding: 8px 20px;
            border-radius: 50px;
            transition: 0.3s;
        }

        .admin-link:hover { 
            background: var(--gold); 
            color: white; 
            box-shadow: 0 5px 15px rgba(195, 163, 101, 0.2);
        }

        /* Loader chique */
        .loading { text-align: center; padding: 100px; font-size: 1.1rem; letter-spacing: 3px; color: var(--gold); text-transform: uppercase; font-weight: 300; }
        
        @media (max-width: 600px) {
            .hero { height: 60vh; }
            .container { margin-top: -50px; }
            #results { gap: 30px; }
            .card-content { padding: 25px; }
        }
    </style>
</head>
<body>

    <section class="hero">
        <h1>Cidade do <span>Berço</span></h1>
        <p>A Curadoria d'Ouro de Guimarães</p>
        
        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="O que deseja descobrir hoje?" onkeyup="filterBusinesses()">
        </div>
    </section>

    <div class="container">
        <div id="results">
            <div class="loading">A carregar a experiência...</div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Guimarães, Portugal. Todos os direitos reservados.</p>
        <a href="/admin/" class="admin-link">Acesso Privado</a>
    </footer>

    <script>
        let allBusinesses = [];

        // Este script mantém o funcionamento da listagem, apenas mudamos os placeholders para imagens chiques
        async function loadBusinesses() {
            const resultsDiv = document.getElementById('results');

            try {
                const response = await fetch('https://api.github.com/repos/Sakevct/cidadedoberco/contents/content/empresas');
                const files = await response.json();

                if (!Array.isArray(files)) throw new Error();

                const entries = [];
                for (let file of files) {
                    if (file.name.endsWith('.md')) {
                        const res = await fetch(file.download_url);
                        const text = await res.text();
                        
                        const titleMatch = text.match(/title:\s*"(.*)"/) || text.match(/title:\s*(.*)/);
                        const catMatch = text.match(/category:\s*"(.*)"/) || text.match(/category:\s*(.*)/);
                        const addrMatch = text.match(/address:\s*"(.*)"/) || text.match(/address:\s*(.*)/);
                        const imgMatch = text.match(/image:\s*"(.*)"/) || text.match(/image:\s*(.*)/);

                        entries.push({
                            title: titleMatch ? titleMatch[1].replace(/"/g, '') : "Curadoria Exclusiva",
                            category: catMatch ? catMatch[1].replace(/"/g, '') : "Seleção Ouro",
                            address: addrMatch ? addrMatch[1].replace(/"/g, '') : "Guimarães",
                            // Placeholder chique: Interior de luxo
                            image: imgMatch ? imgMatch[1].replace(/"/g, '') : "https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?q=80&w=800"
                        });
                    }
                }
                allBusinesses = entries;
                displayBusinesses(allBusinesses);
            } catch (e) {
                resultsDiv.innerHTML = "<div class='loading'>Inicie a sua curadoria no painel de gestão.</div>";
            }
        }

        function displayBusinesses(list) {
            const resultsDiv = document.getElementById('results');
            if (list.length === 0) {
                resultsDiv.innerHTML = "<div class='loading'>Nenhum resultado de ouro encontrado.</div>";
                return;
            }
            resultsDiv.innerHTML = list.map(b => `
                <div class="business-card">
                    <div class="card-img-wrapper">
                        <img src="${b.image}" class="card-img" onerror="this.src='https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?q=80&w=800'">
                    </div>
                    <div class="card-content">
                        <span class="card-tag">${b.category}</span>
                        <h3 class="card-title">${b.title}</h3>
                        <div class="card-info">
                            <span class="card-icon">📍</span> ${b.address}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterBusinesses() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allBusinesses.filter(b => 
                b.title.toLowerCase().includes(term) || 
                b.category.toLowerCase().includes(term)
            );
            displayBusinesses(filtered);
        }

        window.onload = loadBusinesses;
    </script>
</body>
</html>
