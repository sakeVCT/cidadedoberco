<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidade do Berço | SELEÇÃO VIMARANENSE</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Plus+Jakarta+Sans:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <style>
        :root { --gold: #b38e5d; --dark: #0f0f0f; }
        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: #fff; color: var(--dark); overflow-x: hidden; }
        
        header { 
            padding: 70px 20px 50px; /* Reduzido padding do header */
            text-align: center; 
            background: var(--dark); 
            color: white; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wall-icon {
            width: 75px; /* Ligeiramente menor */
            height: auto;
            margin-bottom: 25px; 
            opacity: 0.95;
        }
        .wall-icon path { fill: var(--gold); }

        .logo-main { 
            font-family: 'Cormorant Garamond', serif; 
            font-size: 2.2rem; /* Ligeiramente menor */
            letter-spacing: 4px; 
            text-transform: uppercase; 
            margin: 0;
            font-weight: 600;
            line-height: 1.1;
            white-space: nowrap;
        }

        .logo-sub-bottom { 
            font-size: 0.8rem; 
            letter-spacing: 6px; 
            color: var(--gold); 
            margin-top: 18px;
            font-weight: 300;
            text-transform: uppercase;
        }

        .container { max-width: 850px; margin: 0 auto 80px; padding: 0 20px; }
        
        /* ESPAÇAMENTO REDUZIDO ENTRE CATEGORIAS (-15%) */
        .category-wrapper { padding: 60px 0 30px 0; border-bottom: 1px solid #f5f5f5; }

        .election-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .election-header b { 
            color: var(--gold); 
            text-transform: uppercase; 
            font-size: 0.65rem; 
            letter-spacing: 3px; 
        }

        .election-header span { 
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            color: var(--dark);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .card {
            background: var(--dark);
            border-radius: 20px; /* Cantos um pouco menos redondos */
            overflow: hidden;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.12);
        }

        .card-img {
            width: 100%;
            height: 460px; /* REDUZIDO -15% (era 540px) */
            object-fit: cover;
            display: block;
            opacity: 1; /* Foto totalmente visível */
            cursor: zoom-in;
        }

        .card-content {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 40px 25px 30px; /* Reduzido padding interno */
            /* AJUSTE RADICAL NO GRADIENTE: Muito mais baixo e suave, focado apenas no rodapé */
            background: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.85) 15%, rgba(0,0,0,0) 40%);
            color: white;
            pointer-events: none; /* Garante que cliques passam para a foto se necessário */
        }
        
        .card-content > * { pointer-events: auto; } /* Reativa cliques nos elementos de texto/botoes */

        .badge {
            background: var(--gold);
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 15px;
            display: inline-block;
            letter-spacing: 1.5px;
        }

        .title { 
            font-family: 'Cormorant Garamond', serif; 
            font-size: 2.1rem; 
            margin: 0 0 10px 0; 
            text-transform: uppercase; 
            letter-spacing: 3px;
            line-height: 1.1;
        }
        
        .description { 
            font-size: 0.8rem; 
            color: #f0f0f0; /* Texto ligeiramente mais claro para contraste */
            margin-bottom: 25px; 
            text-transform: uppercase; 
            line-height: 1.5; 
            font-weight: 300;
            max-width: 95%;
        }

        .actions { display: flex; gap: 12px; }
        
        .btn {
            flex: 1; text-align: center;
            padding: 16px; 
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.7rem;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-gold { background: var(--gold); color: white; }
        .btn-outline { border: 1px solid rgba(255,255,255,0.4); color: white; }

        .nominees { 
            margin-top: 20px; 
            padding: 0 8px; 
            color: #aaa; 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
        }

        #lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.98);
            align-items: center;
            justify-content: center;
        }
        #lightbox.active { display: flex; }
        #lightbox img { max-width: 95%; max-height: 85%; border-radius: 4px; }

        footer { text-align: center; padding: 80px 20px; color: #ccc; font-size: 0.65rem; letter-spacing: 2px; }

        .loader { text-align: center; padding: 120px 20px; color: #b38e5d; font-size: 0.85rem; letter-spacing: 2px; text-transform: uppercase; }

        @media (max-width: 480px) {
            .logo-main { font-size: 1.7rem; }
            .card-img { height: 400px; } /* Ajuste proporcional mobile */
            .title { font-size: 1.8rem; }
            .election-header span { font-size: 1.3rem; }
            .container { padding: 0 15px; }
            /* Gradiente mobile ligeiramente ajustado para texto maior */
            .card-content { background: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.9) 20%, rgba(0,0,0,0) 50%); }
        }
    </style>
</head>
<body>

<header>
    <svg class="wall-icon" viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
        <path d="M10,10 L90,10 L90,20 L10,20 L10,10 Z M15,20 L85,20 L85,60 L15,60 L15,20 Z M20,20 L30,20 L30,10 L20,10 L20,20 Z M35,20 L45,20 L45,10 L35,10 L35,20 Z M50,20 L60,20 L60,10 L50,10 L50,20 Z M65,20 L75,20 L75,10 L65,10 L65,20 Z M80,20 L90,20 L90,10 L80,10 L80,20 Z"/>
    </svg>
    <div class="logo-main">Cidade do Berço</div>
    <div class="logo-sub-bottom">SELEÇÃO VIMARANENSE</div>
</header>

<div class="container" id="eleitos-container">
    <div class="loader">A preparar seleções...</div>
</div>

<div id="lightbox" onclick="this.classList.remove('active')">
    <img id="lightbox-img" src="">
</div>

<footer>
    © CIDADE DO BERÇO | TODOS OS DIREITOS RESERVADOS
</footer>

<script>
    const user = "sakevct"; 
    const repo = "cidadedoberco";
    const folder = "content/eleitos";

    async function loadContent() {
        const container = document.getElementById('eleitos-container');
        try {
            const response = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${folder}?t=${new Date().getTime()}`);
            if (!response.ok) throw new Error('Erro API');
            const files = await response.json();
            container.innerHTML = ''; 
            const mdFiles = files.filter(f => f.name.endsWith('.md')).reverse();
            for (const file of mdFiles) {
                const fileRes = await fetch(file.download_url);
                const text = await fileRes.text();
                const parts = text.split('---');
                if (parts.length < 3) continue;
                const content = jsyaml.load(parts[1]);
                const cardHtml = `
                    <div class="category-wrapper">
                        <div class="election-header">
                            <b>ELEITO</b> <span>${content.category || 'DESTAQUE'}</span>
                        </div>
                        <div class="card">
                            <img src="${content.image}" class="card-img" onclick="openLightbox(this.src)" onerror="this.src='https://placehold.co/600x400/0f0f0f/b38e5d?text=IMAGEM+INDISPONIVEL'">
                            <div class="card-content">
                                <div class="badge">PREMIUM</div>
                                <h2 class="title">${content.title}</h2>
                                <p class="description">${content.description || ''}</p>
                                <div class="actions">
                                    <a href="tel:${content.phone}" class="btn btn-gold"><i class="fa-solid fa-phone"></i> CONTACTO</a>
                                    <a href="${content.map_link}" target="_blank" class="btn btn-outline"><i class="fa-solid fa-location-dot"></i> MAPA</a>
                                </div>
                            </div>
                        </div>
                        <div class="nominees"><b>NOMEADOS:</b> ${content.nominees || 'EM ATUALIZAÇÃO'}</div>
                    </div>
                `;
                container.innerHTML += cardHtml;
            }
            if (container.innerHTML === '') container.innerHTML = '<div class="loader">Sem publicações.</div>';
        } catch (error) {
            container.innerHTML = `<div class="loader" style="color: #ff4444;">ERRO DE LIGAÇÃO</div>`;
        }
    }
    function openLightbox(src) {
        document.getElementById('lightbox-img').src = src;
        document.getElementById('lightbox').classList.add('active');
    }
    loadContent();
    if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
            if (!user) {
                window.netlifyIdentity.on("login", () => { document.location.href = "/admin/"; });
            }
        });
    }
</script>

</body>
</html>
